services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy:ro
      - ./sites:/srv/sites:ro
      - ./panel:/srv/panel:ro
      - caddy_data:/data
      - caddy_config:/config

  crm:
    build:
      context: ./ops/crm
    restart: always
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/crm.sqlite
      API_KEY: ${CRM_API_KEY}
      ALLOWED_ORIGINS: ${CRM_ALLOWED_ORIGINS:-}
    expose:
      - "8080"
    volumes:
      - crm_data:/data

  chat:
    build:
      context: ./ops/chat
    restart: always
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/chat.sqlite
      API_KEY: ${CHAT_API_KEY}
      ALLOWED_ORIGINS: ${CHAT_ALLOWED_ORIGINS:-}
      CRM_URL: http://crm:8080/leads
      CRM_API_KEY: ${CRM_API_KEY}
      MODEL_API_URL: ${MODEL_API_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    expose:
      - "8080"
    volumes:
      - chat_data:/data

  content:
    build:
      context: ./ops/content
    restart: always
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/content.sqlite
      API_KEY: ${CONTENT_API_KEY}
      EDITOR_KEY: ${CONTENT_EDITOR_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      AUTH_USERS: ${AUTH_USERS:-}
      ALLOWED_ORIGINS: ${CONTENT_ALLOWED_ORIGINS:-}
    expose:
      - "8080"
    volumes:
      - content_data:/data

volumes:
  caddy_data:
  caddy_config:
  crm_data:
  chat_data:
  content_data:
