<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Палитра — проверка шести масок</title><link rel="stylesheet" href="palitra-platform-preview.css"><style>body{font:16px Arial;background:#f4f3ed;color:#24271f;margin:0;padding:24px}header{max-width:1500px;margin:auto auto 24px}h1{font-size:28px;margin:0 0 12px}label{display:inline-flex;gap:10px;margin-right:20px;align-items:center}select{font:inherit;padding:10px;border:1px solid #bbc1b0;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;max-width:1500px;margin:auto}section{background:white;border-radius:20px;padding:20px;min-width:0}section h2{font-size:18px;margin:0 0 14px}.palitra-preview__card{margin:auto}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){body{padding:12px}.grid{grid-template-columns:1fr}section{padding:14px}header label{display:flex;margin:10px 0}h1{font-size:24px}}</style><header><h1>Шесть масок предпросмотра</h1><p>Изолированная проверка интерфейса. Вымышленные изображения, без сохранений и публикаций.</p><label>Формат<select id="format"><option value="post">Пост</option><option value="story">История</option><option value="reel" selected>Короткое видео</option><option value="carousel">Карусель фотографий</option></select></label><label>Пример файла<select id="shape"><option value="portrait">Вертикальный 9:16</option><option value="landscape">Горизонтальный 16:9</option><option value="square">Квадрат 1:1</option></select></label></header><main class="grid"></main><script src="palitra-platform-preview.js"></script><script>
const platforms={telegram:'Telegram',vk:'ВКонтакте',youtube_shorts:'YouTube Shorts',instagram:'Instagram',tiktok:'TikTok',max:'MAX'};const previews=[];let urls=[];
function media(shape){urls.forEach(URL.revokeObjectURL);urls=[];const [w,h]=shape==='portrait'?[540,960]:shape==='landscape'?[960,540]:[720,720];return [1,2,3].map((n)=>{const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="${['#dfe8d4','#f0dcde','#d6e3ed'][n-1]}"/><rect x="${w*.08}" y="${h*.15}" width="${w*.84}" height="${h*.6}" rx="36" fill="#fff9" stroke="#61784e" stroke-dasharray="10 7"/><circle cx="${w*.5}" cy="${h*.42}" r="${Math.min(w,h)*.22}" fill="#84996c"/><path d="M ${w*.5} ${h*.5} Q ${w*.6} ${h*.7} ${w*.45} ${h*.78}" fill="none" stroke="#61784e" stroke-width="3"/><text x="50%" y="${h*.1}" text-anchor="middle" font-family="Arial" font-size="${w*.04}" fill="#384c30">ВЕРХ КАДРА · ${w} × ${h}</text><text x="50%" y="${h*.65}" text-anchor="middle" font-family="Arial" font-size="${w*.045}" fill="#384c30">ПРОВЕРКА МАКЕТА · ${n}</text><text x="50%" y="${h*.92}" text-anchor="middle" font-family="Arial" font-size="${w*.04}" fill="#384c30">НИЗ КАДРА</text></svg>`;const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));urls.push(url);return {url,type:'image/png',name:'Вымышленный пример '+n};});}
function render(){const files=media(document.querySelector('#shape').value),format=document.querySelector('#format').value;for(const p of previews)p.update({format,media:files});}
const files=media('portrait');for(const [platform,name] of Object.entries(platforms)){const host=document.createElement('section');host.innerHTML='<h2>'+name+'</h2>';const preview=PalitraPlatformPreview.create({document,window,platform,format:'reel',publisherLabel:'Палитра · пример',title:'Проверка читаемости',text:'Идея для вашего праздника 🎈\nТекст и важные детали должны оставаться видны под маской интерфейса.',media:files});host.append(preview.element);document.querySelector('main').append(host);previews.push(preview);}document.querySelectorAll('select').forEach(el=>el.addEventListener('change',render));window.addEventListener('pagehide',()=>{previews.forEach(p=>p.dispose());urls.forEach(URL.revokeObjectURL)});
</script></html>
