<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Чат по заявке — Palitra</title>
<link rel="stylesheet" href="/assets/palitra-chat.css?v=20261014-e1">
</head>
<body>
<div class="pc" id="pc">
  <header class="pc-top">
    <a class="pc-brand" href="/">Palitra</a>
    <span class="pc-sub">чат по заявке</span>
  </header>

  <p class="pc-status" id="pc-status" role="status" aria-live="polite">Открываем чат…</p>
  <div class="pc-row pc-restart" id="pc-restart-wrap" hidden>
    <button type="button" class="pc-btn" id="pc-restart">Открыть чат заново</button>
  </div>

  <main class="pc-main" id="pc-main" hidden>
    <section class="pc-list" id="pc-list" aria-labelledby="pc-list-title">
      <h2 class="pc-list__title" id="pc-list-title">Мои заявки</h2>
      <p class="pc-muted" id="pc-list-status" role="status" aria-live="polite"></p>
      <ul class="pc-threads" id="pc-threads"></ul>
      <button type="button" class="pc-btn pc-btn--quiet pc-more" id="pc-threads-more" hidden>Показать ещё</button>
    </section>

    <section class="pc-view" id="pc-view" hidden aria-labelledby="pc-title">
      <div class="pc-head">
        <button type="button" class="pc-btn pc-btn--quiet" id="pc-back">← Мои заявки</button>
        <h1 class="pc-title" id="pc-title" tabindex="-1"></h1>
      </div>
      <p class="pc-muted" id="pc-telegram-state"></p>
      <div class="pc-row">
        <button type="button" class="pc-btn pc-btn--quiet" id="pc-telegram" hidden>Открыть Telegram</button>
      </div>
      <p class="pc-note" id="pc-telegram-note" role="status" aria-live="polite"></p>
      <p class="pc-muted" id="pc-view-status" role="status" aria-live="polite"></p>
      <button type="button" class="pc-btn pc-btn--quiet pc-more" id="pc-earlier" hidden>Показать ранее</button>
      <ol class="pc-messages" id="pc-messages"></ol>
      <p class="pc-note" id="pc-new-below" role="status" aria-live="polite"></p>
      <form class="pc-composer" id="pc-composer" novalidate>
        <label class="pc-label" for="pc-text">Сообщение менеджеру</label>
        <textarea id="pc-text" rows="3" maxlength="4000" placeholder="Текст сообщения"></textarea>
        <div class="pc-row pc-row--between">
          <span class="pc-muted" id="pc-count">0 / 4000</span>
          <button type="submit" class="pc-btn pc-btn--main" id="pc-send">Отправить</button>
        </div>
        <p class="pc-state" id="pc-state" role="status" aria-live="polite"></p>
        <div class="pc-row" id="pc-blocked" hidden>
          <button type="button" class="pc-btn pc-btn--quiet" id="pc-open-pending">Открыть заявку с неотправленным сообщением</button>
        </div>
        <div class="pc-row" id="pc-unknown" hidden>
          <button type="button" class="pc-btn" id="pc-retry">Проверить и повторить ту же отправку</button>
          <button type="button" class="pc-btn pc-btn--quiet" id="pc-drop">Отказаться от этой отправки</button>
        </div>
      </form>
    </section>

    <p class="pc-muted pc-foot" id="pc-files-note">Фото, видео, голосовые и файлы из Telegram видны здесь. С сайта пока отправляется только текст.
      <button type="button" class="pc-link" id="pc-revoke">Выйти из чата на этом устройстве</button></p>
  </main>
</div>
<script src="/assets/palitra-chat.js?v=20261014-e1" defer></script>
</body>
</html>
