name: view-as
on:
  pull_request:
    paths: ['ops/content/**', 'sites/synapse/**', '.github/workflows/view-as.yml']
  push:
    paths: ['ops/content/**', 'sites/synapse/**', '.github/workflows/view-as.yml']
permissions:
  contents: read
jobs:
  readonly-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ops/content/package-lock.json
      - run: npm ci --prefix ops/content --ignore-scripts
      - run: node --test ops/content/view-as*.test.js
