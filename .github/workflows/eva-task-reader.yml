name: eva-task-reader

on:
  pull_request:
    paths:
      - 'ops/eva-tasks/**'
      - 'ops/crm/eva-task-reader*'
      - 'ops/crm/server.js'
      - 'ops/crm/Dockerfile'
      - '.github/workflows/eva-task-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVA_PACKAGE_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Task reader and transport tests
        run: node --test ops/eva-tasks/*.test.js ops/crm/eva-task-reader.test.js
      - name: Human setup tests
        run: python -m unittest discover -s ops/eva-tasks -p '*_test.py' -v
      - name: Check CRM syntax
        run: node --check ops/crm/server.js
      - name: Build identical immutable preparation packages
        run: |
          python ops/eva-tasks/build_package.py --source "$EVA_PACKAGE_SOURCE" --output "$RUNNER_TEMP/eva-package-a"
          python ops/eva-tasks/build_package.py --source "$EVA_PACKAGE_SOURCE" --output "$RUNNER_TEMP/eva-package-b"
          diff -r "$RUNNER_TEMP/eva-package-a" "$RUNNER_TEMP/eva-package-b"
      - name: Verify delivered Linux command without services or secrets
        run: |
          cd "$RUNNER_TEMP/eva-package-a"
          sha256sum --check SHA256SUMS
          bash COMMAND.txt
          if bash COMMAND.txt; then
            echo 'Repeated preparation unexpectedly overwrote its destination' >&2
            exit 1
          fi
      - name: Build isolated Eva image
        run: docker build -t synapse-eva:test ops/eva-tasks
      - name: Validate dormant Eva compose
        env:
          EVA_OWNER_USER_ID: '123456'
          EVA_TASK_SOCKET_VOLUME: 'synthetic-eva-socket-ci'
        run: docker compose -f ops/eva-tasks/compose.eva.yml config --quiet
