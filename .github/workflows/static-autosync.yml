name: static-autosync
on:
  pull_request:
    paths: ['ops/autosync/**', '.github/workflows/static-autosync.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s ops/autosync -p 'test_*.py' -v
