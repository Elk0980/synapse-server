name: backup-v2
on:
  pull_request:
    paths: ['ops/backup/**', '.github/workflows/backup-v2.yml']
permissions:
  contents: read
jobs:
  roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y age
      - run: python -m unittest discover -s ops/backup -p 'test_*.py' -v
      - run: bash -n ops/backup/inventory.sh
      - run: systemd-analyze verify ops/backup/backup-stream.service ops/backup/backup-stream.timer
