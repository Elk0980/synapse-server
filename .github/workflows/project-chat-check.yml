name: project-chat-check

# Проверка общего чата Хью: тесты сервисов и кабинета, сборка приватного рантайма
# вместе с настоящим доказательством изоляции инструментов, разбор docker compose.
# Образ собирается дважды: из обычного контекста и из контекста с правами umask 077,
# как его оставляет автовыкладка на сервере.
#
# Никакого развёртывания, никаких обращений к подписке и внешним моделям.
# В сборке используется локальный mock-провайдер на loopback и тестовый ключ,
# настоящие секреты сюда не попадают: значения ниже — заведомые заглушки.

on:
  push:
    paths:
      - 'ops/chat/**'
      - 'ops/content/**'
      - 'ops/dev/**'
      - 'ops/hugh-runtime/**'
      - 'ops/local-hugh/**'
      - 'ops/crm/media-mentor*'
      - 'ops/crm/autoposting*'
      - 'ops/crm/server.js'
      - 'ops/crm/social-stats*'
      - 'ops/crm/social-baselines*'
      - 'ops/crm/finance-ai*'
      - 'ops/crm/ai-trials.js'
      - 'ops/crm/commercial*'
      - 'ops/synapse-sync'
      - 'ops/synapse-sync.test.js'
      - 'sites/synapse/cabinet/**'
      - 'sites/synapse/cabinet.html'
      - 'docker-compose.yml'
      - '.github/workflows/project-chat-check.yml'
  pull_request:
    paths:
      - 'ops/chat/**'
      - 'ops/content/**'
      - 'ops/dev/**'
      - 'ops/hugh-runtime/**'
      - 'ops/local-hugh/**'
      - 'ops/crm/media-mentor*'
      - 'ops/crm/autoposting*'
      - 'ops/crm/server.js'
      - 'ops/crm/social-stats*'
      - 'ops/crm/social-baselines*'
      - 'ops/crm/finance-ai*'
      - 'ops/crm/ai-trials.js'
      - 'ops/crm/commercial*'
      - 'ops/synapse-sync'
      - 'ops/synapse-sync.test.js'
      - 'sites/synapse/cabinet/**'
      - 'sites/synapse/cabinet.html'
      - 'docker-compose.yml'
      - '.github/workflows/project-chat-check.yml'

permissions:
  contents: read

concurrency:
  group: project-chat-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # Две сборки образа: обычная и из контекста с правами umask 077.
    timeout-minutes: 50
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # jsdom ставится во временный каталог: файлы зависимостей проекта не меняются.
      - name: Подготовить jsdom для тестов интерфейса
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/testdeps"
          npm install --prefix "$RUNNER_TEMP/testdeps" --no-audit --no-fund --loglevel=error jsdom
          echo "NODE_PATH=$RUNNER_TEMP/testdeps/node_modules" >> "$GITHUB_ENV"

      - name: Проверить, что файлы зависимостей проекта не изменились
        run: git diff --exit-code --stat

      # Пути перечисляются явными шаблонами. Каталог в качестве аргумента не годится:
      # для ops/hugh-runtime Node берёт main из package.json и запускает сам сервис.
      - name: Тесты приватного рантайма Hugh
        timeout-minutes: 10
        run: node --test --test-concurrency=2 ops/hugh-runtime/*.test.js

      # Локальный Windows-обработчик: офлайн-тесты с поддельным транспортом и рантаймом,
      # настоящие SQLite во временном каталоге. Сеть и подписка не нужны.
      - name: Тесты локального обработчика Хью
        timeout-minutes: 10
        run: node --test ops/local-hugh/*.test.js

      # Медиа-наставник: этап основы (бриф и план), внедрение и HTTP-слой.
      # Файлы перечислены явно: каталог ops/crm целиком этой проверкой не покрывается.
      # Только node --test, без сети, публикаций и обращений к моделям.
      - name: Тесты Медиа-наставника
        timeout-minutes: 10
        run: node --test ops/crm/media-mentor.test.js ops/crm/media-mentor-rollout.test.js ops/crm/media-mentor-http.test.js ops/crm/media-mentor-transfer.test.js ops/crm/media-mentor-pilot.test.js

      - name: Тесты исходной статистики до запуска
        timeout-minutes: 10
        run: node --test ops/crm/social-baselines.test.js ops/crm/social-stats.test.js ops/crm/social-stats-http.test.js

      - name: Тесты календаря и публикаций
        timeout-minutes: 10
        run: node --test ops/crm/autoposting*.test.js

      # Расходы на ИИ внутри существующих Финансов и права раздела. Остальные наборы
      # каталога ops/crm этой проверкой по-прежнему не покрываются.
      - name: Тесты Финансы→ИИ
        timeout-minutes: 10
        run: node --test ops/crm/finance-ai.test.js ops/crm/commercial.test.js ops/crm/crm-permissions.test.js

      - name: Тесты сервиса контента
        timeout-minutes: 10
        # HTTP-наборы запускают собственные сервисы и выбирают локальные порты.
        # Последовательный запуск исключает конкуренцию фикстур за порты/ресурсы;
        # все проверки прав, сроков и отказов по-прежнему выполняются.
        run: node --test --test-concurrency=1 ops/content/*.test.js

      - name: Тесты чат-сервиса
        timeout-minutes: 10
        run: node --test ops/chat/*.test.js

      # Только кабинет: здесь лежат тесты Хью, оболочки и интеграции VK, затронутые общим чатом.
      # Тесты в корне sites/synapse относятся к редакторам публичных сайтов и к чату отношения
      # не имеют; на них есть два расхождения, воспроизводимые на origin/main до этой ветки,
      # поэтому они в область проверки общего чата не входят и здесь не правятся.
      - name: Тесты кабинета
        timeout-minutes: 10
        run: node --test sites/synapse/cabinet/*.test.cjs

      - name: Тесты предпросмотра общего чата
        timeout-minutes: 5
        run: node --test ops/dev/project-chat-preview.test.cjs

      # Заглушки git и docker в PATH: ни сети, ни контейнеров, ни развёртывания.
      - name: Тесты повтора автовыкладки
        timeout-minutes: 5
        run: node --test ops/synapse-sync.test.js

      # Сборка образа сама собирает доверенный каталог моделей из встроенного набора
      # закреплённого бинаря и прогоняет проверку изоляции с локальным mock-провайдером.
      # Непройденная проверка останавливает сборку — значит, и эту задачу.
      - name: Собрать образ рантайма с доказательством изоляции
        timeout-minutes: 20
        run: docker build --progress=plain --tag hugh-runtime:check ops/hugh-runtime

      # Воспроизведение продовой поломки: автовыкладка раскладывала рабочую копию под
      # umask 077, COPY уносил права 0600/0700 в образ, и сборка падала после USER hugh
      # на «Cannot read package config /app/package.json». Контекст с такими же правами
      # обязан собираться и давать то же доказательство.
      - name: Собрать образ из контекста с правами umask 077
        timeout-minutes: 20
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/restrictive-context"
          rm -rf "$context"
          mkdir -p "$context"
          cp -a ops/hugh-runtime/. "$context/"
          find "$context" -type d -exec chmod 0700 {} +
          find "$context" -type f -exec chmod 0600 {} +
          test "$(stat -c '%a' "$context/package.json")" = 600
          docker build --progress=plain --tag hugh-runtime:restrictive "$context"

      - name: Убедиться, что доказательство попало в оба образа
        timeout-minutes: 5
        run: |
          set -euo pipefail
          for image in hugh-runtime:check hugh-runtime:restrictive; do
            echo "== $image"
            docker run --rm --entrypoint node "$image" -e "const p = require('/app/build/tool-isolation-proof.json'); const c = require('/app/build/restricted-models.json'); if (p.observedTools.length !== 0) throw new Error('tools не пуст'); if (p.injectedToolCallsExecuted !== false) throw new Error('инъекция выполнилась'); if (p.canaryIntact !== true) throw new Error('канарейка повреждена'); if (c.models.length !== 1) throw new Error('в каталоге не одна модель'); console.log('proof ok', p.codexVersion, c.models[0].slug, p.fingerprint);"
          done

      # Без доверенных корней вход в подписку падает на TLS ещё до сети: именно это
      # и случилось на проде. Проверка идёт от рабочего пользователя образа и разбирает
      # сертификаты по-настоящему — «файл существует» здесь недостаточно.
      - name: Убедиться, что в образах есть доверенные корневые сертификаты
        timeout-minutes: 5
        run: |
          set -euo pipefail
          for image in hugh-runtime:check hugh-runtime:restrictive; do
            echo "== $image"
            docker run --rm --entrypoint node "$image" /app/test-support/check-ca-bundle.js
          done

      - name: Убедиться, что доказательство неизменяемо для рабочего пользователя
        timeout-minutes: 5
        run: |
          set -euo pipefail
          for image in hugh-runtime:check hugh-runtime:restrictive; do
            echo "== $image"
            docker run --rm --entrypoint node "$image" -e "const fs = require('fs'); let blocked = false; try { fs.writeFileSync('/app/build/tool-isolation-proof.json', 'x'); } catch (error) { blocked = true; console.log('неизменяемо:', error.code); } if (!blocked) throw new Error('доказательство перезаписывается рабочим пользователем');"
          done

      # Права приложения проверяются от имени рабочего пользователя: читать можно,
      # писать нельзя, владельцем остаётся root.
      - name: Убедиться, что рабочий пользователь читает /app и не может его изменить
        timeout-minutes: 5
        run: |
          set -euo pipefail
          for image in hugh-runtime:check hugh-runtime:restrictive; do
            echo "== $image"
            docker run --rm --entrypoint node "$image" -e "const fs = require('fs'); const files = ['/app/package.json', '/app/server.js', '/app/runtime.js', '/app/model-catalog.js', '/app/test-support/build-restricted-catalog.js']; for (const file of files) { fs.accessSync(file, fs.constants.R_OK); const mode = fs.statSync(file).mode & 0o777; if (mode !== 0o644) throw new Error(file + ' имеет права ' + mode.toString(8)); } for (const dir of ['/app', '/app/test-support']) { fs.readdirSync(dir); const stat = fs.statSync(dir); if ((stat.mode & 0o777) !== 0o755) throw new Error(dir + ' имеет права ' + (stat.mode & 0o777).toString(8)); if (stat.uid !== 0) throw new Error(dir + ' больше не принадлежит root'); } let blocked = false; try { fs.writeFileSync('/app/package.json', 'x'); } catch (error) { blocked = true; } if (!blocked) throw new Error('рабочий пользователь может переписать /app/package.json'); console.log('app permissions ok');"
          done

      # Только разбор файла: ничего не запускается, не создаётся и не публикуется.
      # Разбор идёт дважды: со значениями по умолчанию (исходящая сеть chat без IPv6)
      # и с включённым выключателем — чтобы схема включённого варианта проверялась здесь,
      # а не на проде в момент переключения.
      - name: Разобрать docker compose
        timeout-minutes: 3
        env:
          CHAT_API_KEY: ci-dummy-chat-key
          CHAT_ADMIN_KEY: ci-dummy-chat-admin-key
          CRM_API_KEY: ci-dummy-crm-key
          CONTENT_API_KEY: ci-dummy-content-key
          TELEGRAM_WEBHOOK_SECRET: ci-dummy-telegram-secret
        run: |
          set -euo pipefail
          docker compose config --quiet
          CHAT_IPV6_ENABLED=true \
          CHAT_NODE_OPTIONS='--dns-result-order=ipv6first --no-network-family-autoselection' \
            docker compose config --quiet
