<text x="800" y="238" text-anchor="middle" font-family="Manrope, sans-serif" font-size="22" letter-spacing="12" fill="#5d6b52">КАК ВОСПОЛЬЗОВАТЬСЯ</text>
<line x1="620" y1="268" x2="980" y2="268" stroke="url(#goldb)" stroke-width="1" opacity="0.6"/>

<g font-family="Manrope, Arial, sans-serif" fill="#3a4633">
  <text x="180" y="330" font-size="25" font-weight="600">1</text>
  <text x="225" y="330" font-size="23">Запишитесь по QR-коду или свяжитесь со студией,</text>
  <text x="225" y="365" font-size="23">чтобы выбрать удобное время.</text>
  <text x="180" y="415" font-size="25" font-weight="600">2</text>
  <text x="225" y="415" font-size="23">Назовите номер сертификата — он указан</text>
  <text x="225" y="450" font-size="23">на лицевой стороне.</text>
  <text x="180" y="500" font-size="25" font-weight="600">3</text>
  <text x="225" y="500" font-size="23">Приходите за 10 минут до начала:</text>
  <text x="225" y="535" font-size="23">заполним короткую анкету.</text>
</g>
<line x1="180" y1="566" x2="1000" y2="566" stroke="#cfd6c3" stroke-width="1"/>
<text x="180" y="610" font-family="Manrope, Arial, sans-serif" font-size="20" letter-spacing="5" fill="#5d6b52">УСЛОВИЯ</text>
<g font-family="Manrope, Arial, sans-serif" font-size="19" fill="#5d6b52">
  <text x="180" y="650">· Сертификат действует 6 месяцев с даты выдачи,</text>
  <text x="196" y="678">если не указан иной срок.</text>
  <text x="180" y="710">· Обменивается на любые услуги студии в пределах номинала.</text>
  <text x="180" y="742">· Если услуга дороже номинала — доплачивается разница на месте.</text>
  <text x="180" y="774">· Денежными средствами не возвращается и на деньги не обменивается.</text>
  <text x="180" y="806">· Передаётся другому человеку без ограничений.</text>
  <text x="180" y="838">· Есть противопоказания — перед визитом</text>
  <text x="196" y="866">проконсультируйтесь со специалистом.</text>
</g>
<g font-family="Manrope, Arial, sans-serif" font-size="17" fill="#6c7a61">
  <text x="180" y="911">Иркутск, ул. Красноказачья, 84 · ежедневно, по записи</text>
  <text x="1420" y="911" text-anchor="end">+7 933 190-10-59 · avokado38.ru</text>
</g>
