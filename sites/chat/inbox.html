<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0d1117" />
    <title>Входящие — Synapse Business</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --raised: #1c222b;
        --line: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --own: #1f6feb;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        color: var(--text);
        background: var(--bg);
        font:
          14px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        color: inherit;
      }
      .unlock {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 20%, #182638, var(--bg) 55%);
      }
      .unlock-card {
        width: min(390px, calc(100% - 32px));
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        box-shadow: 0 20px 70px #0008;
      }
      .unlock-card h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      .unlock-card p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      .unlock-card input,
      .search,
      .composer textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: none;
        color: var(--text);
        background: var(--bg);
      }
      .unlock-card input {
        padding: 12px;
      }
      .primary {
        width: 100%;
        margin-top: 12px;
        padding: 11px;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
        color: #07111e;
        background: var(--accent);
        font-weight: 700;
      }
      .error {
        min-height: 20px;
        margin-top: 10px;
        color: #f85149;
      }
      .app {
        height: 100%;
        display: grid;
        grid-template-columns: 370px 1fr;
      }
      .sidebar {
        min-width: 0;
        border-right: 1px solid var(--line);
        background: var(--panel);
      }
      .sidebar-head {
        padding: 18px 16px 12px;
        border-bottom: 1px solid var(--line);
      }
      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .title-row h1 {
        margin: 0 0 14px;
        font-size: 21px;
      }
      .logout {
        border: 0;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
      }
      .search {
        padding: 10px 12px;
      }
      .filters {
        display: flex;
        gap: 4px;
        margin-top: 11px;
        overflow-x: auto;
      }
      .filter {
        padding: 6px 8px;
        border: 0;
        border-radius: 8px;
        white-space: nowrap;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
      }
      .filter.active {
        color: var(--text);
        background: #263240;
      }
      .chat-list {
        height: calc(100% - 143px);
        overflow-y: auto;
      }
      .chat-item {
        display: grid;
        grid-template-columns: 46px 1fr auto;
        gap: 11px;
        padding: 12px 14px;
        border: 0;
        border-bottom: 1px solid #252c35;
        text-align: left;
        background: transparent;
        cursor: pointer;
      }
      .chat-item:hover,
      .chat-item.active {
        background: #202a35;
      }
      .avatar {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: #07111e;
        background: linear-gradient(145deg, #58a6ff, #a371f7);
        font-size: 17px;
        font-weight: 800;
      }
      .chat-copy {
        min-width: 0;
      }
      .chat-title {
        overflow: hidden;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .preview {
        overflow: hidden;
        margin-top: 4px;
        color: var(--muted);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chat-meta {
        display: flex;
        align-items: flex-end;
        flex-direction: column;
        gap: 7px;
        color: var(--muted);
        font-size: 11px;
      }
      .badge {
        min-width: 20px;
        padding: 2px 6px;
        border-radius: 12px;
        color: #07111e;
        background: var(--accent);
        text-align: center;
        font-weight: 700;
      }
      .dialog {
        min-width: 0;
        display: grid;
        grid-template-rows: 66px 1fr auto;
        background: #10161e;
      }
      .dialog-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 20px;
        border-bottom: 1px solid var(--line);
        background: #161b22e8;
      }
      .back {
        display: none;
        border: 0;
        background: transparent;
        font-size: 22px;
      }
      .dialog-head h2 {
        margin: 0;
        font-size: 16px;
      }
      .company {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
      }
      .messages {
        overflow-y: auto;
        padding: 24px max(20px, calc((100% - 820px) / 2));
      }
      .empty {
        color: var(--muted);
        text-align: center;
      }
      .day {
        margin: 18px auto;
        width: max-content;
        padding: 4px 10px;
        border-radius: 12px;
        color: var(--muted);
        background: #252c35;
        font-size: 11px;
      }
      .message {
        display: flex;
        margin: 7px 0;
      }
      .message.own {
        justify-content: flex-end;
      }
      .bubble {
        max-width: min(72%, 620px);
        padding: 8px 11px;
        border-radius: 4px 13px 13px;
        background: var(--raised);
        box-shadow: 0 1px 2px #0004;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .own .bubble {
        border-radius: 13px 4px 13px 13px;
        background: var(--own);
      }
      .author {
        margin-bottom: 2px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 650;
      }
      .own .author {
        color: #dbeafe;
      }
      .time {
        float: right;
        margin: 5px 0 -3px 12px;
        color: #ffffff99;
        font-size: 10px;
      }
      .composer {
        padding: 13px max(20px, calc((100% - 820px) / 2)) 18px;
        border-top: 1px solid var(--line);
        background: var(--panel);
      }
      .composer form {
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }
      .composer textarea {
        min-height: 42px;
        max-height: 130px;
        resize: none;
        padding: 10px 12px;
      }
      .send {
        width: 42px;
        height: 42px;
        flex: 0 0 42px;
        border: 0;
        border-radius: 50%;
        color: #07111e;
        background: var(--accent);
        cursor: pointer;
        font-size: 20px;
      }
      .send:disabled {
        opacity: 0.4;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 720px) {
        .app {
          display: block;
        }
        .sidebar,
        .dialog {
          width: 100%;
          height: 100%;
        }
        .app.chat-open .sidebar {
          display: none;
        }
        .app:not(.chat-open) .dialog {
          display: none;
        }
        .back {
          display: block;
        }
        .bubble {
          max-width: 88%;
        }
        .messages,
        .composer {
          padding-left: 12px;
          padding-right: 12px;
        }
      }
    </style>
  </head>
  <body>
    <section class="unlock" id="unlock">
      <form class="unlock-card" id="keyForm">
        <h1>Входящие Synapse</h1>
        <p>Введите ключ владельца. До авторизации переписка не загружается.</p>
        <input
          id="keyInput"
          type="password"
          autocomplete="current-password"
          placeholder="CHAT_ADMIN_KEY"
          required
        />
        <button class="primary" type="submit">Открыть входящие</button>
        <div class="error" id="keyError" role="alert"></div>
      </form>
    </section>
    <main class="app" id="app" hidden>
      <aside class="sidebar">
        <div class="sidebar-head">
          <div class="title-row">
            <h1>Входящие</h1>
            <button class="logout" id="logout" type="button">
              Сменить ключ
            </button>
          </div>
          <input class="search" id="search" type="search" placeholder="Поиск" />
          <nav class="filters" id="filters" aria-label="Компании">
            <button class="filter active" data-company="" type="button">
              Все
            </button>
            <button class="filter" data-company="alvi" type="button">
              ALVI
            </button>
            <button class="filter" data-company="avokado" type="button">
              Авокадо
            </button>
            <button class="filter" data-company="palitra" type="button">
              Палитра
            </button>
          </nav>
        </div>
        <div class="chat-list" id="chatList"></div>
      </aside>
      <section class="dialog">
        <header class="dialog-head">
          <button class="back" id="back" type="button" aria-label="К списку">
            ‹
          </button>
          <div>
            <h2 id="dialogTitle">Выберите диалог</h2>
            <div class="company" id="dialogCompany"></div>
          </div>
        </header>
        <div class="messages" id="messages">
          <p class="empty">Выберите чат в списке слева</p>
        </div>
        <div class="composer">
          <form id="messageForm">
            <textarea
              id="messageInput"
              rows="1"
              maxlength="4000"
              placeholder="Напишите сообщение…"
              disabled
            ></textarea>
            <button
              class="send"
              id="send"
              type="submit"
              aria-label="Отправить"
              disabled
            >
              ↑
            </button>
          </form>
        </div>
      </section>
    </main>
    <script>
      const STORAGE_KEY = "synapse_chat_admin_key";
      const companyNames = {
        alvi: "ALVI",
        avokado: "Авокадо",
        palitra: "Палитра",
        synapse: "Synapse",
      };
      const app = document.getElementById("app");
      const unlock = document.getElementById("unlock");
      const chatList = document.getElementById("chatList");
      const messages = document.getElementById("messages");
      const input = document.getElementById("messageInput");
      const sendButton = document.getElementById("send");
      let apiKey = localStorage.getItem(STORAGE_KEY) || "";
      let conversations = [];
      let activeId = null;
      let company = "";

      async function api(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: {
            "content-type": "application/json",
            "x-api-key": apiKey,
            ...options.headers,
          },
        });
        if (response.status === 401) throw new Error("Ключ не принят");
        if (!response.ok)
          throw new Error(`Ошибка сервиса: HTTP ${response.status}`);
        return response.json();
      }

      function formatTime(value) {
        if (!value) return "";
        const date = new Date(value);
        const today = new Date().toDateString() === date.toDateString();
        return new Intl.DateTimeFormat(
          "ru-RU",
          today
            ? { hour: "2-digit", minute: "2-digit" }
            : { day: "2-digit", month: "2-digit" },
        ).format(date);
      }

      function filteredConversations() {
        const query = document
          .getElementById("search")
          .value.trim()
          .toLowerCase();
        return conversations.filter(
          (item) =>
            !query ||
            item.title.toLowerCase().includes(query) ||
            (item.lastMessage || "").toLowerCase().includes(query),
        );
      }

      function renderList() {
        chatList.textContent = "";
        for (const item of filteredConversations()) {
          const button = document.createElement("button");
          button.className = `chat-item${item.id === activeId ? " active" : ""}`;
          button.type = "button";
          const name = companyNames[item.company] || item.company;
          button.innerHTML = `
          <span class="avatar">${name.slice(0, 1).toUpperCase()}</span>
          <span class="chat-copy">
            <span class="chat-title">${escapeHtml(item.title)}</span>
            <span class="preview">${escapeHtml(item.lastMessage || "Нет сообщений")}</span>
          </span>
          <span class="chat-meta">
            <span>${formatTime(item.lastMessageAt)}</span>
            ${item.unreadCount ? `<span class="badge">${item.unreadCount}</span>` : ""}
          </span>`;
          button.addEventListener("click", () => openConversation(item.id));
          chatList.append(button);
        }
        if (!chatList.children.length)
          chatList.innerHTML = '<p class="empty">Диалогов нет</p>';
      }

      function escapeHtml(value) {
        const node = document.createElement("span");
        node.textContent = value;
        return node.innerHTML;
      }

      async function loadConversations() {
        const suffix = company ? `?company=${encodeURIComponent(company)}` : "";
        const data = await api(`/admin/conversations${suffix}`);
        conversations = data.conversations;
        renderList();
      }

      function dayLabel(value) {
        return new Intl.DateTimeFormat("ru-RU", {
          day: "numeric",
          month: "long",
          year: "numeric",
        }).format(new Date(value));
      }

      function renderMessages(items) {
        messages.textContent = "";
        let currentDay = "";
        for (const item of items) {
          const day = dayLabel(item.created_at);
          if (day !== currentDay) {
            const divider = document.createElement("div");
            divider.className = "day";
            divider.textContent = day;
            messages.append(divider);
            currentDay = day;
          }
          const row = document.createElement("div");
          row.className = `message${item.author_type === "owner" ? " own" : ""}`;
          const bubble = document.createElement("div");
          bubble.className = "bubble";
          if (item.author_name) {
            const author = document.createElement("div");
            author.className = "author";
            author.textContent = item.author_name;
            bubble.append(author);
          }
          bubble.append(document.createTextNode(item.text));
          const time = document.createElement("span");
          time.className = "time";
          time.textContent = formatTime(item.created_at);
          bubble.append(time);
          row.append(bubble);
          messages.append(row);
        }
        messages.scrollTop = messages.scrollHeight;
      }

      async function openConversation(id, quiet = false) {
        activeId = id;
        const data = await api(`/admin/conversations/${id}/messages`);
        document.getElementById("dialogTitle").textContent =
          data.conversation.title || `Диалог ${id}`;
        document.getElementById("dialogCompany").textContent =
          companyNames[data.conversation.company] || data.conversation.company;
        input.disabled = false;
        sendButton.disabled = !input.value.trim();
        renderMessages(data.messages);
        renderList();
        app.classList.add("chat-open");
        if (!quiet)
          await api(`/admin/conversations/${id}/read`, { method: "POST" });
      }

      async function unlockWithKey(key) {
        apiKey = key;
        await loadConversations();
        localStorage.setItem(STORAGE_KEY, apiKey);
        unlock.hidden = true;
        app.hidden = false;
      }

      document
        .getElementById("keyForm")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const error = document.getElementById("keyError");
          error.textContent = "";
          try {
            await unlockWithKey(document.getElementById("keyInput").value);
          } catch (reason) {
            error.textContent = reason.message;
          }
        });
      document.getElementById("logout").addEventListener("click", () => {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      });
      document.getElementById("search").addEventListener("input", renderList);
      document
        .getElementById("filters")
        .addEventListener("click", async (event) => {
          const button = event.target.closest("[data-company]");
          if (!button) return;
          company = button.dataset.company;
          document
            .querySelectorAll(".filter")
            .forEach((item) =>
              item.classList.toggle("active", item === button),
            );
          await loadConversations();
        });
      document
        .getElementById("back")
        .addEventListener("click", () => app.classList.remove("chat-open"));
      input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = `${Math.min(input.scrollHeight, 130)}px`;
        sendButton.disabled = !activeId || !input.value.trim();
      });
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          document.getElementById("messageForm").requestSubmit();
        }
      });
      document
        .getElementById("messageForm")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const text = input.value.trim();
          if (!activeId || !text) return;
          input.value = "";
          sendButton.disabled = true;
          await api(`/admin/conversations/${activeId}/messages`, {
            method: "POST",
            body: JSON.stringify({ text }),
          });
          await Promise.all([
            openConversation(activeId, true),
            loadConversations(),
          ]);
        });
      setInterval(async () => {
        if (!apiKey || app.hidden) return;
        try {
          await loadConversations();
          if (activeId) await openConversation(activeId, true);
        } catch (error) {
          console.warn("Автообновление:", error.message);
        }
      }, 5000);
      if (apiKey) {
        unlockWithKey(apiKey).catch(() => {
          localStorage.removeItem(STORAGE_KEY);
          apiKey = "";
        });
      }
    </script>
  </body>
</html>
