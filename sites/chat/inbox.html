<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Входящие — Synapse Business</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--raised:#1c222b;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--own:#1f6feb}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}button,input,textarea{font:inherit;color:inherit}.hidden{display:none!important}.login{height:100%;display:grid;place-items:center}.login-card{width:min(390px,calc(100% - 32px));padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 70px #0008}.login h1{margin:0 0 8px;font-size:22px}.login p{color:var(--muted);margin:0 0 20px}.login input,.search,input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;outline:0}.login input:focus,.search:focus,textarea:focus{border-color:var(--accent)}.primary{border:0;border-radius:10px;background:var(--accent);color:#081526;font-weight:700;padding:11px 16px;cursor:pointer}.login .primary{width:100%;margin-top:12px}.error{color:#f85149;min-height:20px;margin-top:10px}.app{height:100%;display:grid;grid-template-columns:380px 1fr}.sidebar{min-width:0;background:var(--panel);border-right:1px solid var(--line);display:grid;grid-template-rows:auto auto auto 1fr}.side-head{height:64px;padding:0 18px;display:flex;align-items:center;justify-content:space-between}.side-head h1{font-size:19px;margin:0}.icon{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:19px}.search-wrap{padding:0 12px 10px}.filters{padding:0 12px 10px;display:flex;gap:5px;overflow:auto}.filter{white-space:nowrap;border:0;border-radius:14px;padding:6px 9px;background:transparent;color:var(--muted);cursor:pointer}.filter.active{background:#1f6feb33;color:var(--accent)}.chat-list{overflow:auto}.chat-item{width:100%;border:0;border-top:1px solid #252c35;background:transparent;text-align:left;display:grid;grid-template-columns:48px 1fr auto;gap:11px;padding:12px;cursor:pointer}.chat-item:hover,.chat-item.active{background:var(--raised)}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#2f81f7,#8250df);font-size:18px;font-weight:800}.chat-main{min-width:0}.chat-title-line{display:flex;align-items:center;gap:7px}.chat-title{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.channel{color:var(--muted);font-size:11px}.preview{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.meta{text-align:right;color:var(--muted);font-size:11px}.badge{display:block;margin:8px 0 0 auto;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#07111e;text-align:center;line-height:21px;font-weight:800}.dialog{min-width:0;display:grid;grid-template-rows:64px 1fr auto;background:radial-gradient(circle at 50% -20%,#182638 0,transparent 50%)}.empty-dialog{grid-row:1/-1;display:grid;place-items:center;color:var(--muted)}.dialog-head{padding:0 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:#0d1117e8}.back{display:none}.dialog-head strong{font-size:16px}.company{color:var(--muted);font-size:12px;text-transform:uppercase}.messages{overflow:auto;padding:24px max(22px,calc((100% - 800px)/2));}.day{text-align:center;color:var(--muted);font-size:12px;margin:15px}.message{max-width:70%;margin:5px 0;display:flex}.message.own{margin-left:auto;justify-content:flex-end}.bubble{background:var(--panel);border:1px solid var(--line);padding:9px 12px;border-radius:5px 14px 14px 14px;white-space:pre-wrap;overflow-wrap:anywhere}.own .bubble{background:var(--own);border-color:var(--own);border-radius:14px 5px 14px 14px}.author{color:var(--accent);font-size:12px;font-weight:650}.time{color:#b1bac4;font-size:10px;margin-left:8px;float:right;margin-top:6px}.composer{padding:12px max(20px,calc((100% - 820px)/2)) 18px;display:flex;gap:9px;align-items:end}.composer textarea{width:100%;min-height:44px;max-height:140px;resize:none;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px;outline:0}.send{width:44px;height:44px;padding:0}.status{position:fixed;right:18px;top:15px;color:var(--muted);font-size:11px}
@media(max-width:720px){.app{display:block}.sidebar,.dialog{height:100%}.app.dialog-open .sidebar{display:none}.app:not(.dialog-open) .dialog{display:none}.back{display:block}.sidebar{border:0}.message{max-width:88%}.messages{padding:15px 10px}.composer{padding:10px}.side-head{height:58px}.dialog-head{height:58px}}
</style></head><body>
<section class="login" id="login"><form class="login-card" id="keyForm"><h1>Входящие Synapse</h1><p>Введите ключ владельца. До авторизации переписка не загружается.</p><input id="keyInput" type="password" autocomplete="current-password" placeholder="CHAT_ADMIN_KEY" required><button class="primary" type="submit">Открыть входящие</button><div class="error" id="loginError"></div></form></section>
<main class="app hidden" id="app"><aside class="sidebar"><div class="side-head"><h1>Входящие</h1><button class="icon" id="logout" title="Удалить ключ">⚙</button></div><div class="search-wrap"><input class="search" id="search" type="search" placeholder="Поиск"></div><nav class="filters" id="filters"><button class="filter active" data-company="">Все</button><button class="filter" data-company="alvi">ALVI</button><button class="filter" data-company="avokado">Авокадо</button><button class="filter" data-company="palitra">Палитра</button></nav><div class="chat-list" id="chatList"></div></aside><section class="dialog" id="dialog"><div class="empty-dialog" id="empty">Выберите чат слева</div><header class="dialog-head hidden" id="dialogHead"><button class="icon back" id="back">←</button><div><strong id="dialogTitle"></strong><div class="company" id="dialogCompany"></div></div></header><div class="messages hidden" id="messages"></div><form class="composer hidden" id="composer"><textarea id="text" rows="1" maxlength="4000" placeholder="Сообщение"></textarea><button class="primary send" type="submit">↑</button></form></section></main><div class="status" id="status"></div>
<script>
const API='',KEY_NAME='synapse_chat_admin_key';let key=localStorage.getItem(KEY_NAME)||'',company='',selected=null,conversations=[],lastDay='';
const $=id=>document.getElementById(id),esc=s=>String(s??'');
async function api(path,options={}){const response=await fetch(API+path,{...options,headers:{'content-type':'application/json','x-api-key':key,...options.headers}});if(response.status===401){showLogin('Ключ не принят');throw new Error('401');}if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json();}
function showLogin(message=''){ $('login').classList.remove('hidden');$('app').classList.add('hidden');$('loginError').textContent=message; }
function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden'); }
function time(value){if(!value)return '';return new Date(value).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});}function label(code){return{alvi:'ALVI',avokado:'Авокадо',palitra:'Палитра',synapse:'Synapse'}[code]||code;}
function renderList(){const q=$('search').value.toLowerCase();$('chatList').textContent='';conversations.filter(c=>`${c.title} ${c.lastMessage}`.toLowerCase().includes(q)).forEach(c=>{const button=document.createElement('button');button.className='chat-item'+(c.id===selected?' active':'');button.innerHTML=`<span class="avatar">${esc(label(c.company)[0])}</span><span class="chat-main"><span class="chat-title-line"><span class="chat-title"></span><span class="channel">${c.channel==='telegram'?'Telegram':'Web'}</span></span><span class="preview"></span></span><span class="meta">${time(c.lastMessageAt)}${c.unreadCount?`<b class="badge">${c.unreadCount>99?'99+':c.unreadCount}</b>`:''}</span>`;button.querySelector('.chat-title').textContent=c.title;button.querySelector('.preview').textContent=c.lastMessage||'Нет сообщений';button.onclick=()=>openChat(c.id);$('chatList').append(button);});}
async function loadList(){try{const data=await api('/admin/conversations'+(company?`?company=${company}`:''));conversations=data.conversations;renderList();$('status').textContent=`Обновлено ${time(new Date())}`;}catch(e){if(e.message!=='401')$('status').textContent='Ошибка обновления';}}
async function openChat(id){selected=id;$('app').classList.add('dialog-open');renderList();await api(`/admin/conversations/${id}/read`,{method:'POST',body:'{}'});await loadMessages();loadList();}
async function loadMessages(){if(!selected)return;try{const data=await api(`/admin/conversations/${selected}/messages`),c=data.conversation;$('empty').classList.add('hidden');['dialogHead','messages','composer'].forEach(id=>$(id).classList.remove('hidden'));$('dialogTitle').textContent=c.title||`Диалог ${c.id}`;$('dialogCompany').textContent=`${label(c.company)} · ${c.channel}`;$('messages').textContent='';lastDay='';data.messages.forEach(addMessage);$('messages').scrollTop=$('messages').scrollHeight;}catch(e){if(e.message!=='401')$('status').textContent='Не удалось загрузить чат';}}
function addMessage(m){const date=new Date(m.createdAt),day=date.toLocaleDateString('ru',{day:'numeric',month:'long',year:'numeric'});if(day!==lastDay){const d=document.createElement('div');d.className='day';d.textContent=day;$('messages').append(d);lastDay=day;}const own=m.authorType==='owner',row=document.createElement('div');row.className='message'+(own?' own':'');const bubble=document.createElement('div');bubble.className='bubble';if(!own&&m.authorName){const author=document.createElement('div');author.className='author';author.textContent=m.authorName;bubble.append(author);}const content=document.createElement('span');content.textContent=m.text;const stamp=document.createElement('span');stamp.className='time';stamp.textContent=time(m.createdAt);bubble.append(content,stamp);row.append(bubble);$('messages').append(row);}
$('keyForm').onsubmit=async e=>{e.preventDefault();key=$('keyInput').value;try{await api('/admin/conversations');localStorage.setItem(KEY_NAME,key);showApp();loadList();}catch(_){}};$('logout').onclick=()=>{localStorage.removeItem(KEY_NAME);key='';showLogin();};$('search').oninput=renderList;$('filters').onclick=e=>{const b=e.target.closest('[data-company]');if(!b)return;company=b.dataset.company;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));loadList();};$('back').onclick=()=>$('app').classList.remove('dialog-open');
$('composer').onsubmit=async e=>{e.preventDefault();const text=$('text').value.trim();if(!text||!selected)return;$('text').value='';try{const result=await api(`/admin/conversations/${selected}/messages`,{method:'POST',body:JSON.stringify({text})});if(result.delivery?.ok===false)$('status').textContent=result.delivery.description;await loadMessages();loadList();}catch(e){$('text').value=text;}};$('text').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit();}};
if(key){showApp();loadList();}else showLogin();setInterval(()=>{if(key){loadList();if(selected)loadMessages();}},5000);
</script></body></html>
