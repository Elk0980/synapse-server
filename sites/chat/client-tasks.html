<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Задачи клиентов</title><style>
body{margin:0;background:#0d1117;color:#e6edf3;font:14px system-ui;padding:28px}main{max-width:1100px;margin:auto}h1{margin-top:0}.bar,form{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input,select,textarea,button{background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:10px;font:inherit}button{cursor:pointer;background:#238636}table{width:100%;border-collapse:collapse;background:#161b22}th,td{text-align:left;padding:12px;border-bottom:1px solid #30363d;vertical-align:top}dialog{background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:14px;width:min(620px,90vw)}form{display:grid}textarea{min-height:90px}.dim{color:#8b949e}@media(max-width:700px){body{padding:16px}table,tbody,tr,td{display:block}thead{display:none}tr{padding:10px}td{border:0;padding:5px}}
</style></head><body><main><h1>Задачи клиентов</h1><div class="bar"><input id="key" type="password" placeholder="CHAT_ADMIN_KEY"><select id="company"><option value="alvi">ALVI</option><option value="avokado">Авокадо</option><option value="palitra">Palitra</option></select><button id="refresh">Обновить</button><button id="open">Создать задачу</button></div><p id="message" class="dim"></p><table><thead><tr><th>Задача</th><th>Срок</th><th>Статус</th><th>Исполнитель</th></tr></thead><tbody id="rows"></tbody></table></main><dialog><form id="form"><h2>Новая задача</h2><input name="title" required placeholder="Название"><textarea name="why" required placeholder="Зачем это нужно бизнесу"></textarea><textarea name="instruction" required placeholder="Пошаговая инструкция (Markdown)"></textarea><input name="link" type="url" placeholder="Прямая ссылка"><input name="due" type="date"><select name="assignee"><option value="client">Клиент</option><option value="owner">Владелец</option><option value="team">Команда</option></select><div><button>Создать</button> <button type="button" id="cancel">Отмена</button></div></form></dialog><script>
const $=s=>document.querySelector(s),key=$('#key'),company=$('#company'),message=$('#message');key.value=sessionStorage.chatAdminKey||'';const esc=v=>String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function api(path,options={}){sessionStorage.chatAdminKey=key.value;const r=await fetch(path,{...options,headers:{'content-type':'application/json','x-api-key':key.value,...options.headers}});if(!r.ok)throw new Error((await r.json()).error||`HTTP ${r.status}`);return r.json()}
async function load(){message.textContent='Загрузка…';try{const data=await api(`/client-tasks?company=${company.value}`);$('#rows').innerHTML=data.tasks.map(t=>`<tr><td><b>${esc(t.title)}</b><br><span class="dim">${esc(t.why)}</span></td><td>${esc(t.due||'—')}</td><td>${esc(t.status)}</td><td>${esc(t.assignee)}</td></tr>`).join('');message.textContent=data.tasks.length?`${data.tasks.length} задач`:'Задач пока нет'}catch(e){message.textContent=e.message}}
$('#refresh').onclick=load;company.onchange=load;$('#open').onclick=()=>document.querySelector('dialog').showModal();$('#cancel').onclick=()=>document.querySelector('dialog').close();$('#form').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));body.company=company.value;try{await api('/client-tasks',{method:'POST',body:JSON.stringify(body)});document.querySelector('dialog').close();e.target.reset();load()}catch(err){alert(err.message)}};if(key.value)load();
</script></body></html>
