<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Мои задачи — ALVI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#173c32;--deep:#0c2922;--cream:#f4f0e7;--paper:#fffdf8;--gold:#b7935b;--muted:#68756f;--line:#dcd9cf;--danger:#8d3e39}*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--deep);font:15px/1.6 Manrope,sans-serif}header{background:var(--green);color:#fff;padding:42px 20px 72px}header div,main{max-width:880px;margin:auto}h1,h2,h3{font-family:Lora,serif}h1{margin:0;font-size:clamp(30px,7vw,52px);font-weight:500}.lead{color:#d9e2dd;margin:9px 0 0}.list{display:grid;gap:18px;margin-top:-38px}.task{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,5vw,32px);box-shadow:0 12px 36px #173c3212}.task h3{font-size:24px;margin:0 0 12px}.why{background:#edf1eb;border-radius:12px;padding:13px 15px}.why b,.label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}.instruction{white-space:pre-wrap;margin:22px 0}.meta{color:var(--muted);font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button,.link{border:0;border-radius:999px;padding:12px 19px;font:600 14px Manrope;cursor:pointer;text-decoration:none}.done{background:var(--green);color:#fff}.blocked{background:transparent;color:var(--danger);border:1px solid #cba9a5}.link{background:var(--gold);color:#fff;display:inline-block;margin-top:6px}.comment{display:none;margin-top:14px}.comment.open{display:block}textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}.finished{margin:42px 0}.finished .task{opacity:.7;padding:18px 22px}.finished .instruction,.finished .why,.finished .actions,.finished .link{display:none}.empty,.state{text-align:center;padding:52px 20px;background:var(--paper);border-radius:20px}.state{max-width:620px;margin:60px auto}.spinner{margin:80px;text-align:center}@media(max-width:560px){header{padding-top:30px}.actions button,.actions .link{width:100%;text-align:center}.task h3{font-size:21px}}
</style>  <link rel="stylesheet" href="mobile.css?v=20260907">
  <script src="mobile-performance.js?v=20260907" defer></script>
</head><body><header><div><h1>Задачи ALVI</h1><p class="lead">Всё, что нужно сделать, — спокойно и по шагам.</p></div></header><main id="app"><p class="spinner">Загружаем задачи…</p></main>
<script>
const app=document.querySelector('#app'),token=new URLSearchParams(location.search).get('t');
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const markdown=value=>esc(value).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^#{1,3}\s+(.+)$/gm,'<strong>$1</strong>').replace(/^[-*]\s+/gm,'• ');
const date=value=>value?new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'}).format(new Date(`${value}T12:00:00`)):'Без срока';
function card(t){return `<article class="task" data-id="${t.id}"><h3>${esc(t.title)}</h3><div class="why"><b>Зачем это нужно</b>${esc(t.why)}</div><div class="instruction"><span class="label">Что сделать</span>${markdown(t.instruction)}</div>${t.link?`<a class="link" href="${esc(t.link)}" target="_blank" rel="noopener">Открыть нужный экран</a>`:''}<p class="meta">Срок: ${esc(date(t.due))}</p><div class="actions"><button class="done" data-status="done">Сделала</button><button class="blocked" data-show>Не получилось</button></div><div class="comment"><textarea placeholder="Расскажите, что помешало — мы поможем"></textarea><div class="actions"><button class="blocked" data-status="blocked">Отправить комментарий</button></div></div></article>`}
function render(tasks){const active=tasks.filter(t=>t.status!=='done'),done=tasks.filter(t=>t.status==='done');app.innerHTML=`<section class="list">${active.length?active.map(card).join(''):'<div class="empty"><h2>На сегодня всё</h2><p>Новых задач пока нет.</p></div>'}</section>${done.length?`<section class="finished"><h2>Готово</h2><div class="list">${done.map(card).join('')}</div></section>`:''}`}
async function load(){if(!token)return invalid();try{const r=await fetch(`/t/${encodeURIComponent(token)}`);if(!r.ok)return invalid();render((await r.json()).tasks)}catch{return invalid('Не удалось загрузить доску. Попробуйте ещё раз чуть позже.')}}
function invalid(message='Ссылка недействительна. Попросите команду Synapse прислать новую ссылку.'){app.innerHTML=`<div class="state"><h2>Не удалось открыть задачи</h2><p>${esc(message)}</p></div>`}
app.addEventListener('click',async e=>{const task=e.target.closest('.task');if(!task)return;if(e.target.matches('[data-show]'))return task.querySelector('.comment').classList.add('open');const status=e.target.dataset.status;if(!status)return;const comment=task.querySelector('textarea').value.trim();if(status==='blocked'&&!comment)return task.querySelector('textarea').focus();e.target.disabled=true;try{const r=await fetch(`/t/${encodeURIComponent(token)}/${task.dataset.id}/status`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status,comment})});if(!r.ok)throw new Error();await load()}catch{e.target.disabled=false;alert('Не удалось сохранить. Попробуйте ещё раз.')}});load();
</script></body></html>
