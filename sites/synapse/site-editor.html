<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Редактор сайта ALVI — тексты и фоны</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #16221a; --ink: #fffdf8; --ink-dim: rgba(255, 253, 248, 0.8); --ink-faint: rgba(255, 253, 248, 0.56);
      --gold: #e3d4a7; --gold-soft: #b39a68; --green-deep: #e3d4a7;
      --line: rgba(255, 255, 255, 0.16);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; color: var(--ink); background: var(--bg);
      font-family: "Lora", Georgia, serif; font-size: 1rem; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }

    .page-water { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .page-water__video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .page-water__veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 18, 13, 0.6) 0%, rgba(10, 18, 13, 0.68) 100%); }

    .price-header {
      position: relative; z-index: 2;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: clamp(1rem, 2.5vw, 1.75rem) clamp(1.25rem, 4vw, 3rem);
      background: rgba(9, 17, 12, 0.55);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .price-header img { display: block; height: 3.2rem; width: auto; }
    .price-header__back {
      display: inline-flex; align-items: center; min-height: 2.6rem; padding: 0.55rem 1rem;
      font-size: 0.78rem; letter-spacing: 0.09em; text-transform: uppercase; text-decoration: none;
      border: 1px solid var(--line); border-radius: 999px; background: rgba(255, 255, 255, 0.08);
      color: var(--ink);
    }
    .price-header__back:hover { border-color: rgba(255, 255, 255, 0.6); background: rgba(255, 253, 248, 0.9); color: #12211a; }

    .price-intro {
      position: relative; z-index: 2;
      padding: clamp(2rem, 5vw, 3.5rem) clamp(1.25rem, 4vw, 3rem) 0;
    }
    .price-intro h1 {
      margin: 0; font-family: "Lora", Georgia, serif; font-weight: 400;
      font-size: clamp(2rem, 4.5vw, 3.4rem); line-height: 1.12; text-wrap: balance;
    }
    .price-intro p { margin: 0.9rem 0 0; max-width: 44rem; color: var(--ink-dim); }

    .price-layout {
      position: relative; z-index: 2;
      display: grid; grid-template-columns: minmax(0, 17rem) minmax(0, 1fr);
      gap: clamp(1.5rem, 3vw, 3rem); align-items: start;
      padding: clamp(1.5rem, 4vw, 3rem) clamp(1.25rem, 4vw, 3rem) clamp(4rem, 8vw, 6rem);
    }

    .pnav {
      position: sticky; top: 1.25rem;
      max-height: calc(100vh - 2.5rem); overflow: auto; overscroll-behavior: contain;
      padding: 1.1rem 1rem; border: 1px solid var(--line); border-radius: 1.25rem;
      background: rgba(13, 23, 17, 0.6);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .pnav ul { margin: 0; padding: 0; list-style: none; }
    .pnav > ul > li + li { margin-top: 0.85rem; }
    .pnav__top {
      display: block; font-family: "Lora", Georgia, serif; font-size: 1.05rem; line-height: 1.3;
      text-decoration: none; color: var(--ink);
    }
    .pnav__top:hover, .pnav__top.is-active { color: var(--gold); }
    .pnav__sub { display: none; margin: 0.45rem 0 0; padding-left: 0.85rem; border-left: 1px solid var(--line); }
    .pnav li.is-open > .pnav__sub { display: block; }
    .pnav li.has-sub > .pnav__top { position: relative; padding-right: 1.4rem; }
    .pnav li.has-sub > .pnav__top::after {
      content: ""; position: absolute; right: 0.35rem; top: 0.45em;
      width: 0.45em; height: 0.45em; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg); transition: transform 200ms ease; opacity: 0.7;
    }
    .pnav li.has-sub.is-open > .pnav__top::after { transform: rotate(225deg); top: 0.6em; }
    .pnav__sub li + li { margin-top: 0.3rem; }
    .pnav__sub a {
      display: block; padding: 0.12rem 0; color: var(--ink-dim);
      font-size: 0.86rem; line-height: 1.4; text-decoration: none;
    }
    .pnav__sub a:hover, .pnav__sub a.is-active { color: var(--gold); }

    .pnav-toggle { display: none; }

    .price-layout > * { min-width: 0; }
    .price-content { min-width: 0; }
    .ps { min-width: 0; scroll-margin-top: 1.5rem; }
    .pc { min-width: 0; }
    .ps + .ps { margin-top: clamp(2.5rem, 5vw, 4rem); }
    .ps__title {
      margin: 0 0 1.4rem; font-family: "Lora", Georgia, serif; font-weight: 400;
      font-size: clamp(1.6rem, 3vw, 2.4rem); line-height: 1.2;
    }
    .cert-photo { margin: 0 0 1.4rem; }
    .cert-photo img { display: block; width: min(100%, 24rem); height: auto; border-radius: 1rem; border: 1px solid var(--line); }
    @media (min-width: 62rem) {
      .cert-photo { float: right; margin: 0 0 1rem 1.5rem; }
      .cert-photo img { width: 17rem; }
      #s8::after { content: ""; display: block; clear: both; }
    }
    .pc { position: relative; }
    .pc__badge { position: absolute; top: 1rem; right: 1.1rem; color: var(--gold); font-size: 0.78rem; letter-spacing: 0.04em; }
    .pt__star { color: var(--gold); margin-right: 0.35rem; }
    .ps__note { margin: 0 0 1.2rem; color: var(--ink-dim); font-size: 0.92rem; }

    .pc {
      scroll-margin-top: 1.5rem;
      padding: clamp(1.25rem, 2.4vw, 1.9rem);
      border: 1px solid var(--line); border-radius: 1.25rem;
      background: rgba(13, 23, 17, 0.55);
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    }
    .pc + .pc { margin-top: 1rem; }
    .pc__title {
      margin: 0; font-family: "Lora", Georgia, serif; font-weight: 400;
      font-size: clamp(1.25rem, 2.2vw, 1.65rem); line-height: 1.25;
    }
    .pc__list { margin: 0.9rem 0 0; padding-left: 1.1rem; color: var(--ink-dim); }
    .pc__list li { margin: 0.18rem 0; }
    .pc__meta {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.6rem 1.5rem;
      margin: 1.1rem 0 0; padding-top: 0.9rem; border-top: 1px solid var(--line);
    }
    .pc__dur { color: var(--ink-faint); font-size: 0.9rem; }
    .pc__price { font-family: "Lora", Georgia, serif; font-size: 1.5rem; color: var(--gold); }
    .pc__actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.1rem; }
    .pc__actions--section { margin-top: 1.4rem; }
    .pc__button {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 2.75rem; padding: 0.7rem 1.2rem;
      font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      text-decoration: none; border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 999px;
      color: var(--ink); background: rgba(255, 255, 255, 0.08);
      transition: color 180ms ease, background-color 180ms ease, border-color 180ms ease;
    }
    .pc__button--main { color: #12211a; border-color: rgba(227, 212, 167, 0.9); background: var(--gold); }
    .pc__button:hover { border-color: rgba(255, 255, 255, 0.7); color: #12211a; background: rgba(255, 253, 248, 0.9); }
    .pc__button--main:hover { color: #12211a; background: #f0e4c4; }

    .pt-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 1.25rem;
      background: rgba(13, 23, 17, 0.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
    .pt { width: 100%; border-collapse: collapse; min-width: 30rem; }
    .pt th, .pt td { padding: 0.85rem clamp(0.85rem, 1.6vw, 1.4rem); text-align: left; }
    .pt th { color: var(--ink-faint); font-size: 0.74rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; }
    .pt tbody tr + tr td { border-top: 1px solid var(--line); }
    .pt__price { white-space: nowrap; font-weight: 600; color: var(--gold); }

    .cert { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; }
    .cert__card {
      padding: clamp(1.25rem, 2.4vw, 1.9rem); border: 1px solid var(--line); border-radius: 1.25rem;
      background: rgba(13, 23, 17, 0.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    }
    .cert__card p { margin: 0.7rem 0 0; color: var(--ink-dim); }

    .site-footer {
      position: relative; z-index: 2;
      padding: clamp(2.5rem, 5vw, 4rem) clamp(1.25rem, 4vw, 3rem);
      color: rgba(255, 253, 248, 0.78); background: #1b2a1e;
      font-size: 0.86rem; line-height: 1.7;
    }
    .site-footer__inner { width: min(100%, 75rem); margin-inline: auto; }
    .site-footer p { margin: 0; }
    .site-footer__brand { font-family: "Lora", Georgia, serif; font-size: 1.3rem; color: #fffdf8; margin-bottom: 0.6rem; }
    .site-footer__links { margin-top: 0.6rem; display: flex; flex-wrap: wrap; gap: 0.4rem 1.4rem; }
    .site-footer__links a { color: rgba(255, 253, 248, 0.9); }

    .floating-cta {
      position: fixed; right: clamp(0.85rem, 2.2vw, 2.4rem); bottom: clamp(0.85rem, 2.2vw, 2rem);
      z-index: 60; display: grid; gap: 0.4rem; justify-items: center; pointer-events: none;
    }
    .floating-cta__row { display: flex; gap: 0.55rem; pointer-events: auto; }
    .floating-cta { transition: opacity 300ms ease, transform 300ms ease; }
    .floating-cta.is-hidden { opacity: 0; transform: translateY(0.75rem); }
    .floating-cta.is-hidden .floating-cta__row { pointer-events: none; }
    .floating-cta__button {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      overflow: hidden; min-width: 11.5rem; min-height: 2.9rem; padding: 0.75rem 1.1rem;
      color: rgba(255, 253, 248, 0.96); font-size: 0.82rem; font-weight: 600; letter-spacing: 0.035em;
      text-align: center; text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.32); border-radius: 999px;
      background: linear-gradient(135deg, rgba(46, 70, 51, 0.72) 0%, rgba(18, 30, 22, 0.66) 45%, rgba(46, 70, 51, 0.72) 100%);
      backdrop-filter: blur(12px) saturate(140%); -webkit-backdrop-filter: blur(12px) saturate(140%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 12px 32px rgba(4, 12, 8, 0.4);
    }
    .floating-cta__button::after {
      content: ""; position: absolute; inset: -20% -40%;
      background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, 0.45) 50%, transparent 62%);
      transform: translateX(-130%); animation: glassSheen 6s ease-in-out infinite; pointer-events: none;
    }
    @keyframes glassSheen { 0%, 70% { transform: translateX(-130%); } 100% { transform: translateX(130%); } }
    .floating-cta__note {
      margin: 0; padding: 0.15rem 0.6rem; color: rgba(255, 253, 248, 0.9); font-size: 0.66rem;
      letter-spacing: 0.05em; border-radius: 999px; background: rgba(12, 22, 16, 0.55);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); pointer-events: none;
    }

    @media (max-width: 62rem) {
      .price-layout { grid-template-columns: 1fr; }
      .pnav { position: static; max-height: none; }
      .pnav > ul { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 0.7rem; }
      .pnav > ul > li + li { margin-top: 0; }
    }

    @media (max-width: 34rem) {
      .floating-cta { left: clamp(0.85rem, 2.2vw, 2.4rem); justify-items: stretch; }
      .floating-cta__row { justify-content: center; }
      .floating-cta__button { min-width: 0; flex: 1 1 0; padding: 0.7rem 0.6rem; font-size: 0.74rem; }
      .pc__button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .page-water__video { display: none; }
      .floating-cta__button::after { animation: none; opacity: 0; }
    }
  </style>
  <style>
    /* --- Надстройка редактора поверх стилей прайса --- */
    .ed-bar {
      position: sticky; top: 0; z-index: 50;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1rem;
      padding: 0.7rem clamp(1rem, 3vw, 2.5rem);
      background: rgba(9, 17, 12, 0.88); border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .ed-bar__title { font-family: "Lora", Georgia, serif; font-size: 1.05rem; margin-right: auto; }
    .ed-bar__title small { display: block; font-size: 0.78rem; color: var(--ink-faint); }
    .ed-btn {
      display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer;
      min-height: 2.4rem; padding: 0.45rem 1rem; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.32); color: var(--ink); background: rgba(46,70,51,0.55);
      font: inherit; font-size: 0.86rem; letter-spacing: 0.02em;
    }
    .ed-btn:hover { border-color: rgba(255,255,255,0.6); }
    .ed-btn--main { background: var(--gold); color: #17220f; border-color: transparent; font-weight: 600; }
    .ed-btn--main:disabled { opacity: 0.55; cursor: default; }
    .ed-btn--ghost { background: transparent; }
    .ed-btn--small { min-height: 1.9rem; padding: 0.2rem 0.7rem; font-size: 0.78rem; }
    .ed-btn--danger { border-color: rgba(220,120,110,0.5); color: #f3c2bb; }
    .ed-status { font-size: 0.86rem; color: var(--ink-dim); max-width: 34rem; }
    .ed-bar > .ed-status { flex: 1 1 10rem; text-align: right; font-size: 0.8rem; }
    .ed-status.is-error { color: #f3c2bb; }
    .ed-status.is-ok { color: var(--gold); }
    .ed-dirty { display: inline-block; width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--gold); margin-left: 0.4rem; vertical-align: middle; }

    .ed-star {
      position: absolute; top: 0.9rem; right: 1rem; z-index: 2;
      width: 2.2rem; height: 2.2rem; border-radius: 50%; border: 1px solid rgba(255,255,255,0.18);
      background: rgba(9,17,12,0.35); color: rgba(255,255,255,0.45); font-size: 1.2rem; line-height: 1;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      transition: color 150ms, transform 150ms, border-color 150ms;
    }
    .ed-star:hover { transform: scale(1.08); border-color: rgba(255,255,255,0.4); }
    .ed-star.is-on { color: #e3d4a7; border-color: rgba(227,212,167,0.6); text-shadow: 0 0 10px rgba(227,212,167,0.5); }
    .ed-star--row { position: static; width: 1.7rem; height: 1.7rem; font-size: 0.95rem; margin-right: 0.45rem; vertical-align: middle; }
    .ed-star.is-shake { animation: edShake 300ms ease; }
    @keyframes edShake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

    .ed-count { font-size: 0.78rem; color: var(--ink-faint); margin-left: 0.6rem; letter-spacing: 0.04em; vertical-align: middle; white-space: nowrap; }
    .ed-count.is-full { color: var(--gold); }
    .pnav { top: 5.4rem !important; max-height: calc(100vh - 6.6rem) !important; }
    .pnav .pnav__top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; padding-right: 0 !important; }
    .pnav .ed-count { margin: 0; }
    .pnav li.has-sub > .pnav__top::after { display: none; }
    .ps, .pc, .pt tr { scroll-margin-top: 5.6rem; }
    .pt td .ed-form { grid-template-columns: 1fr 1fr; }
    .ed-hint { display: block; margin: 0.25rem 0 0.75rem; font-size: 0.8rem; color: #f3c2bb; }

    .ed-row-tools { display: inline-flex; gap: 0.3rem; margin-left: 0.5rem; vertical-align: middle; }
    .pc__tools { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    .ed-section-tools { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0 0; }
    .ed-title-tools { display: inline-flex; gap: 0.3rem; margin-left: 0.6rem; vertical-align: middle; }

    .ed-form { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem 1rem; margin-top: 0.8rem; }
    .ed-form label { display: grid; gap: 0.25rem; font-size: 0.78rem; color: var(--ink-faint); letter-spacing: 0.03em; }
    .ed-form label.is-wide { grid-column: 1 / -1; }
    .ed-form input, .ed-form textarea, .ed-select {
      font: inherit; font-size: 0.92rem; color: var(--ink); padding: 0.55rem 0.7rem;
      border: 1px solid var(--line); border-radius: 0.6rem; background: rgba(9,17,12,0.45);
    }
    .ed-form textarea { min-height: 5.5rem; resize: vertical; }
    .ed-form input:focus, .ed-form textarea:focus { outline: 1px solid var(--gold); }
    .ed-form__actions { grid-column: 1 / -1; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .ed-form small { color: var(--ink-faint); font-size: 0.74rem; }

    .ed-showcase { display: grid; gap: 0.55rem; margin: 0.5rem 0 1rem; }
    .ed-showcase__item {
      display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0.8rem;
      border: 1px solid var(--line); border-radius: 0.8rem; background: rgba(9,17,12,0.35);
    }
    .ed-showcase__num { width: 1.4rem; color: var(--gold); font-family: "Lora", Georgia, serif; }
    .ed-showcase__name { flex: 1 1 auto; min-width: 0; }
    .ed-showcase__name small { display: block; color: var(--ink-faint); font-size: 0.76rem; }
    .ed-showcase__empty { color: var(--ink-faint); font-size: 0.9rem; }
    .ed-add { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .ed-select { min-width: 16rem; max-width: 100%; }

    .ed-modal { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center; background: rgba(4,10,6,0.7); padding: 1rem; }
    .ed-modal.is-open { display: flex; }
    .ed-modal__box { width: min(34rem, 100%); max-height: 85vh; overflow: auto; padding: 1.3rem; border-radius: 1rem; border: 1px solid var(--line); background: #13201a; }
    .ed-modal__box h3 { margin: 0 0 0.8rem; font-family: "Lora", Georgia, serif; font-weight: 400; }
    .ed-modal__list { display: grid; gap: 0.4rem; margin: 0 0 1rem; padding: 0; list-style: none; }
    .ed-modal__list li { display: flex; align-items: center; gap: 0.6rem; padding: 0.45rem 0.6rem; border: 1px solid var(--line); border-radius: 0.6rem; font-size: 0.86rem; }
    .ed-modal__list li span { flex: 1 1 auto; }
    .ed-modal input { width: 100%; }
    .ed-preview { position: fixed; right: 1rem; bottom: 1rem; z-index: 60; }
    @media (max-width: 62rem) {
      .ed-form { grid-template-columns: 1fr; }
      .pnav .ed-count { float: none; }
    }
    .ed-fields { display: grid; gap: 0.8rem; margin-top: 1rem; }
    .ed-field { display: grid; gap: 0.3rem; }
    .ed-field__label { font-size: 0.78rem; color: var(--ink-faint); letter-spacing: 0.03em; }
    .ed-field input, .ed-field textarea {
      font: inherit; font-size: 0.95rem; color: var(--ink); padding: 0.6rem 0.75rem; width: 100%;
      border: 1px solid var(--line); border-radius: 0.6rem; background: rgba(9,17,12,0.45); resize: vertical;
    }
    .ed-field input:focus, .ed-field textarea:focus { outline: 1px solid var(--gold); }
    .ed-bg { padding: 1rem; border: 1px solid var(--line); border-radius: 1rem; background: rgba(9,17,12,0.35); margin-top: 0.8rem; }
    .ed-bg__head { display: flex; gap: 0.8rem; align-items: baseline; margin-bottom: 0.6rem; }
    .ed-bg__preview { height: 9rem; border-radius: 0.7rem; background-size: cover; background-position: center; border: 1px solid var(--line); }
    .ed-bg__preview--empty { display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 0.85rem; }
    .ed-bg__tools { display: flex; flex-wrap: wrap; gap: 0.6rem 1rem; align-items: center; margin: 0.7rem 0 0.4rem; }
    .ed-bg__tools input[type=range] { vertical-align: middle; width: 8rem; }
    .ed-btn input[type=file] { display: none; }
  </style>
</head>
<body>
  <div class="page-water is-on" aria-hidden="true">
    <video class="page-water__video" autoplay muted loop playsinline poster="https://alvi.synapsebusiness.ru/img/water-poster.jpg">
      <source src="https://alvi.synapsebusiness.ru/img/water-loop.webm" type="video/webm">
      <source src="https://alvi.synapsebusiness.ru/img/water-loop.mp4" type="video/mp4">
    </video>
    <div class="page-water__veil"></div>
  </div>

  <div class="ed-bar">
    <div class="ed-bar__title">Редактор сайта ALVI — тексты и фоны<small id="ed-sub">загрузка…</small></div>
    <span class="ed-status" id="ed-status"></span>
    <button class="ed-btn ed-btn--ghost" id="ed-history" type="button">История</button>
    <button class="ed-btn ed-btn--ghost" id="ed-key" type="button">Ключ</button>
    <a class="ed-btn ed-btn--ghost" href="price-editor.html">Прайс</a>
    <a class="ed-btn ed-btn--ghost" href="https://alvi.synapsebusiness.ru/" target="_blank" rel="noopener">Открыть сайт ↗</a>
    <button class="ed-btn ed-btn--main" id="ed-save" type="button">Сохранить</button>
  </div>

  <div class="price-layout">
    <nav class="pnav" aria-label="Разделы прайса">
      <ul id="ed-nav"></ul>
    </nav>
    <div class="price-content" id="ed-content">
      <p class="ed-status">Загружаю тексты сайта…</p>
    </div>
  </div>

  <div class="ed-modal" id="ed-modal"><div class="ed-modal__box" id="ed-modal-box"></div></div>

    <script>
(() => {
  'use strict';
  const params = new URLSearchParams(location.search);
  const API_BASE = (params.get('api') || '').replace(/\/$/, '');
  const API = API_BASE + '/content/alvi/site';
  const ASSETS = API_BASE + '/content/alvi/assets';
  const SITE = 'https://alvi.synapsebusiness.ru';
  const KEY_STORAGE = 'synapse_content_key';

  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let data = null;
  let dirty = false;
  let author = '';

  const statusEl = $('#ed-status');
  const subEl = $('#ed-sub');
  const saveBtn = $('#ed-save');

  function setStatus(text, kind) { statusEl.textContent = text; statusEl.className = 'ed-status' + (kind ? ' is-' + kind : ''); }
  function markDirty() { dirty = true; saveBtn.textContent = 'Сохранить •'; setStatus('Есть несохранённые изменения'); }
  function imgUrl(p) { if (!p) return ''; if (/^https?:/.test(p)) return p; return SITE + (p.startsWith('/') ? p : '/' + p); }

  /* --- рендер --- */
  function fieldHtml(sec, f) {
    const id = `f-${f.key.replace(/[^\w-]/g, '_')}`;
    const long = f.multiline || (f.value && (f.value.length > 90 || f.value.includes('\n')));
    const control = long
      ? `<textarea id="${id}" data-field="${esc(f.key)}" rows="${Math.min(8, Math.max(2, Math.ceil((f.value || '').length / 80)))}">${esc(f.value)}</textarea>`
      : `<input id="${id}" data-field="${esc(f.key)}" value="${esc(f.value)}">`;
    return `<label class="ed-field"><span class="ed-field__label">${esc(f.label)}</span>${control}</label>`;
  }
  function backgroundHtml(sec) {
    const bg = sec.background;
    if (!bg) return '';
    const current = bg.image || bg.default;
    const isCustom = !!bg.image;
    const preview = current ? `<div class="ed-bg__preview" style="background-image:url('${esc(imgUrl(current))}')"></div>` : `<div class="ed-bg__preview ed-bg__preview--empty">без картинки — видна вода</div>`;
    const op = bg.opacity != null && bg.opacity !== '' ? Number(bg.opacity) : 0.1;
    return `<div class="ed-bg" data-bg="${esc(sec.id)}">
      <div class="ed-bg__head"><strong>Фон блока</strong><span class="ed-status">${isCustom ? 'своя картинка' : (bg.default ? 'как было изначально' : 'изначально без картинки')}</span></div>
      ${preview}
      <div class="ed-bg__tools">
        <label class="ed-btn ed-btn--small">Загрузить картинку<input type="file" accept="image/jpeg,image/png,image/webp" data-upload="${esc(sec.id)}" hidden></label>
        <button class="ed-btn ed-btn--small" type="button" data-bg-reset="${esc(sec.id)}" ${isCustom || bg.opacity != null ? '' : 'disabled'}>Вернуть как было</button>
        <label class="ed-status">Яркость фона <input type="range" min="0.05" max="1" step="0.05" value="${op}" data-opacity="${esc(sec.id)}"> <span data-opacity-val="${esc(sec.id)}">${Math.round(op * 100)}%</span></label>
      </div>
      <small class="ed-status">JPEG, PNG или WebP до 8 МБ. Картинка ложится под текст блока полупрозрачно; яркость регулируется ползунком.</small>
    </div>`;
  }
  function sectionHtml(sec) {
    return `<section class="ps" id="sec-${esc(sec.id)}" data-sec="${esc(sec.id)}">
      <h2 class="ps__title">${esc(sec.title)}</h2>
      ${backgroundHtml(sec)}
      <div class="ed-fields">${(sec.fields || []).map((f) => fieldHtml(sec, f)).join('')}</div>
    </section>`;
  }
  function render() {
    const y = window.scrollY;
    $('#ed-nav').innerHTML = data.sections.map((s) => `<li><a class="pnav__top" href="#sec-${esc(s.id)}">${esc(s.title)}</a></li>`).join('');
    $('#ed-content').innerHTML = data.sections.map(sectionHtml).join('\n');
    subEl.textContent = `версия ${data.version || '—'} · обновлено ${data.updatedAt ? new Date(data.updatedAt).toLocaleString('ru-RU') : '—'}` + (author ? ` · вы: ${author}` : '') + (dirty ? ' · не сохранено' : '');
    window.scrollTo(0, y);
    initNav();
  }
  function initNav() {
    const links = [...document.querySelectorAll('.pnav a')];
    const targets = links.map((a) => ({ a, el: document.querySelector(a.getAttribute('href')) })).filter((x) => x.el);
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { const hit = targets.find((t) => t.el === e.target); if (hit) hit.a.classList.toggle('is-active', e.isIntersecting); });
    }, { rootMargin: '-10% 0px -75% 0px', threshold: 0 });
    targets.forEach((t) => io.observe(t.el));
  }

  /* --- изменения --- */
  function findField(key) { for (const s of data.sections) for (const f of s.fields || []) if (f.key === key) return f; return null; }
  function sectionOf(id) { return data.sections.find((s) => s.id === id); }
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset.field) { const f = findField(t.dataset.field); if (f && f.value !== t.value) { f.value = t.value; markDirty(); } }
    if (t.dataset.opacity) {
      const sec = sectionOf(t.dataset.opacity); if (!sec || !sec.background) return;
      sec.background.opacity = Number(t.value);
      const v = document.querySelector(`[data-opacity-val="${t.dataset.opacity}"]`); if (v) v.textContent = Math.round(Number(t.value) * 100) + '%';
      const reset = document.querySelector(`[data-bg-reset="${t.dataset.opacity}"]`); if (reset) reset.disabled = false;
      markDirty();
    }
  });
  document.addEventListener('change', async (e) => {
    const t = e.target;
    if (t.dataset.upload && t.files && t.files[0]) {
      const file = t.files[0]; const secId = t.dataset.upload;
      await upload(secId, file);
      t.value = '';
    }
  });
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, a');
    if (!t) return;
    if (t.dataset.bgReset) {
      const sec = sectionOf(t.dataset.bgReset);
      if (sec && sec.background) { sec.background.image = null; sec.background.opacity = null; markDirty(); render(); }
      return;
    }
    if (t.dataset.restore) return restore(t.dataset.restore);
    if (t.dataset.close) return $('#ed-modal').classList.remove('is-open');
    if (t.id === 'ed-save') return save();
    if (t.id === 'ed-history') return showHistory();
    if (t.id === 'ed-key') { getKey(true); whoami(); return; }
  });

  async function upload(secId, file) {
    const sec = sectionOf(secId); if (!sec || !sec.background) return;
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return setStatus('Нужен JPEG, PNG или WebP', 'error');
    if (file.size > 8 * 1024 * 1024) return setStatus('Файл больше 8 МБ', 'error');
    setStatus('Загружаю картинку…');
    try {
      const key = getKey(false); if (!key) throw new Error('Без ключа загрузить нельзя');
      const r = await fetch(ASSETS, { method: 'POST', headers: { 'X-API-Key': key, 'Content-Type': file.type, 'X-Filename': encodeURIComponent(file.name) }, body: file });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
      sec.background.image = j.url;
      markDirty(); render();
      setStatus('Картинка загружена — нажмите «Сохранить», чтобы она появилась на сайте', 'ok');
    } catch (err) {
      if (err.status === 401) { try { sessionStorage.removeItem(KEY_STORAGE); } catch (x) {} }
      setStatus('Не загружено: ' + err.message, 'error');
    }
  }

  /* --- ключ, сохранение, история --- */
  function getKey(force) {
    let key = '';
    try { key = sessionStorage.getItem(KEY_STORAGE) || ''; } catch (e) {}
    if (!key || force) {
      key = (prompt('Ключ редактора. Хранится только в этой вкладке.') || '').trim();
      try { if (key) sessionStorage.setItem(KEY_STORAGE, key); } catch (e) {}
    }
    return key;
  }
  async function apiFetch(url, opts = {}, withKey = false) {
    const headers = { 'Accept': 'application/json', ...(opts.headers || {}) };
    if (withKey) { const key = getKey(false); if (!key) throw new Error('Без ключа сохранить нельзя'); headers['X-API-Key'] = key; }
    const r = await fetch(url, { ...opts, headers, cache: 'no-store' });
    let body = null; try { body = await r.json(); } catch (e) {}
    if (!r.ok) {
      const msg = body?.error || `HTTP ${r.status}`;
      const details = Array.isArray(body?.details) ? '\n— ' + body.details.join('\n— ') : '';
      const err = new Error(msg + details); err.status = r.status; throw err;
    }
    return body;
  }
  async function whoami() {
    try { let key = ''; try { key = sessionStorage.getItem(KEY_STORAGE) || ''; } catch (e) {} if (!key) return; const w = await fetch(API_BASE + '/content/whoami', { headers: { 'X-API-Key': key } }); if (w.ok) { author = (await w.json()).author; render(); } } catch (e) {}
  }
  async function save() {
    if (!data) return;
    saveBtn.disabled = true; setStatus('Сохраняю…');
    try {
      const res = await apiFetch(API, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }, true);
      data.version = res.version; data.updatedAt = res.updatedAt; dirty = false; saveBtn.textContent = 'Сохранить';
      await whoami();
      setStatus(`Сохранено ${new Date(res.updatedAt).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })} · версия ${res.version}. На сайте — сразу после обновления страницы.`, 'ok');
      render();
    } catch (e) {
      if (e.status === 401) { try { sessionStorage.removeItem(KEY_STORAGE); } catch (x) {} }
      setStatus('Не сохранено: ' + e.message, 'error'); alert('Не сохранено.\n' + e.message);
    } finally { saveBtn.disabled = false; }
  }
  async function showHistory() {
    const box = $('#ed-modal-box'); const modal = $('#ed-modal');
    box.innerHTML = '<h3>История версий</h3><p class="ed-status">Загружаю…</p>'; modal.classList.add('is-open');
    try {
      const h = await apiFetch(API + '/history');
      const li = (h.versions || []).map((v) => `<li><span>версия ${v.version} · ${new Date(v.created_at).toLocaleString('ru-RU')} · ${esc(v.author || '')}</span><button class="ed-btn ed-btn--small" type="button" data-restore="${v.version}">Вернуть</button></li>`).join('');
      box.innerHTML = `<h3>История версий</h3><ul class="ed-modal__list">${li || '<li>пусто</li>'}</ul><button class="ed-btn ed-btn--small" type="button" data-close="1">Закрыть</button>`;
    } catch (e) { box.innerHTML = `<h3>История версий</h3><p class="ed-status is-error">${esc(e.message)}</p><button class="ed-btn ed-btn--small" type="button" data-close="1">Закрыть</button>`; }
  }
  async function restore(version) {
    if (!confirm(`Вернуть версию ${version}? Текущее состояние останется в истории.`)) return;
    try { await apiFetch(API + '/restore/' + version, { method: 'POST' }, true); $('#ed-modal').classList.remove('is-open'); await loadData(); setStatus(`Возвращена версия ${version}`, 'ok'); }
    catch (e) { setStatus('Откат не выполнен: ' + e.message, 'error'); alert('Откат не выполнен.\n' + e.message); }
  }
  async function loadData() { data = await apiFetch(API); dirty = false; saveBtn.textContent = 'Сохранить'; render(); }

  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); } });

  (async () => {
    try { await loadData(); await whoami(); setStatus('Готово к работе'); }
    catch (e) { setStatus('Не удалось загрузить тексты сайта: ' + e.message, 'error'); $('#ed-content').innerHTML = `<p class="ed-status is-error">Не удалось загрузить: ${esc(e.message)}</p>`; }
  })();
})();

  </script>
</body>
</html>
