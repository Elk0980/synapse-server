<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проекты Синапс — Palitra Love Заказы</title>
<link rel="stylesheet" href="assets/editor-fonts.css?v=1">
<link rel="stylesheet" href="form-builder.css?v=20261014-1">
<link rel="stylesheet" href="menu-builder.css?v=20261014-1">
<link rel="stylesheet" href="style.css?v=20261014-board-14">
<link rel="stylesheet" href="flow-canvas.css?v=20261014-3">
</head>
<body>
<div class="board" id="board">
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__logo" aria-hidden="true">S</span>
      <span class="topbar__name">Проекты Синапс</span>
      <nav class="crumbs" aria-label="Проект">
        <span class="crumbs__item">Palitra Love</span>
        <span class="crumbs__sep" aria-hidden="true">›</span>
        <span class="crumbs__item crumbs__item--current" aria-current="page">Palitra Love Заказы</span>
      </nav>
    </div>
    <nav class="seg" aria-label="Раздел">
      <button type="button" class="seg__btn" data-tab="screens">Экраны</button>
      <button type="button" class="seg__btn" data-tab="flow">Блок-схема</button>
    </nav>
    <div class="seg" role="group" aria-label="Режим">
      <button type="button" class="seg__btn" data-mode="view">Просмотреть</button>
      <button type="button" class="seg__btn" data-mode="edit">Редактировать</button>
    </div>
    <div class="panel-controls" role="group" aria-label="Боковые панели">
      <button type="button" class="icon-toggle" data-panel-toggle="left" aria-pressed="true" aria-label="Скрыть список" title="Скрыть список">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="5.5" y="6.5" width="4.5" height="11" rx="1" fill="currentColor"/></svg>
      </button>
      <button type="button" class="icon-toggle" data-panel-pin="left" aria-pressed="true" aria-label="Открепить список" title="Открепить список">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M9 3.5h6l-1 6 3.5 3.5H6.5L10 9.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 13v7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <span class="panel-controls__sep" aria-hidden="true"></span>
      <button type="button" class="icon-toggle" data-panel-pin="right" aria-pressed="true" aria-label="Открепить инспектор" title="Открепить инспектор">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M9 3.5h6l-1 6 3.5 3.5H6.5L10 9.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 13v7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="icon-toggle" data-panel-toggle="right" aria-pressed="true" aria-label="Скрыть инспектор" title="Скрыть инспектор">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="6.5" width="4.5" height="11" rx="1" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="topbar__end">
      <a class="btn btn--product" id="open-product" href="https://palitra-love.ru/love-app/shop.html#K01" target="_blank" rel="noopener" title="Открыть клиентское приложение с главной страницы">Открыть приложение ↗</a>
      <button type="button" class="icon-btn history-btn" id="undo" aria-label="Отменить изменение" title="Отменить изменение (Ctrl+Z)" disabled>↶</button>
      <button type="button" class="icon-btn history-btn" id="redo" aria-label="Повторить изменение" title="Повторить изменение (Ctrl+Shift+Z)" disabled>↷</button>
      <button type="button" class="btn btn--quiet" id="versions" hidden>История</button>
      <button type="button" class="btn btn--quiet" id="export">Экспорт JSON</button>
      <span class="save" id="save" role="status" aria-live="polite" data-state="idle">Загрузка…</span>
    </div>
  </header>
  <div class="banner" id="banner" role="alert" hidden></div>
  <nav class="panes" id="panes" aria-label="Части редактора">
    <button type="button" class="panes__btn" data-pane="list">Список</button>
    <button type="button" class="panes__btn" data-pane="stage">Экран</button>
    <button type="button" class="panes__btn" data-pane="inspector">Инспектор</button>
  </nav>
  <main class="workspace" id="workspace" data-pane="stage" data-left="open" data-right="open">
    <!-- Левая панель: заголовок неподвижен, прокрутка — у внешнего левого края (direction:rtl только у контейнера). -->
    <aside class="panel panel--left" id="panel-left" aria-label="Экраны">
      <button type="button" class="panel__rail" data-panel-toggle="left" aria-label="Показать список" title="Показать список"><span aria-hidden="true">›</span><span class="panel__rail-text">Список</span></button>
      <div class="panel__head"><span class="panel__title">Список экранов</span></div>
      <div class="panel__scroll panel__scroll--left"><div class="panel__content sidebar" id="sidebar"></div></div>
    </aside>
    <section class="stage" id="stage" aria-label="Превью"></section>
    <!-- Правая панель: заголовок неподвижен, прокрутка — у внешнего правого края. -->
    <aside class="panel panel--right" id="panel-right" aria-label="Инспектор">
      <button type="button" class="panel__rail" data-panel-toggle="right" aria-label="Показать инспектор" title="Показать инспектор"><span aria-hidden="true">‹</span><span class="panel__rail-text">Инспектор</span></button>
      <div class="panel__head"><span class="panel__title">Инспектор</span></div>
      <div class="panel__scroll panel__scroll--right"><div class="panel__content inspector" id="inspector"></div></div>
    </aside>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>
<script src="project-forms-api.js?v=20261015-1" defer></script>
<script src="form-builder.js?v=20261016-phone-1" defer></script>
<script src="menu-builder.js?v=20261014-1" defer></script>
<script src="flow-canvas.js?v=20261014-3" defer></script>
<script src="app.js?v=20261016-phone-1" defer></script>

<!-- PALITRA_ACTION_CONTROLS_R3 -->
<link rel="stylesheet" href="/content/ui/palitra-action-icons.css?v=20261021-r5">
<script src="/content/ui/palitra-action-icons.js?v=20261021-r5" defer></script>
</body>
</html>
