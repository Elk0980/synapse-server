<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Живое ядро Синапса</title><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--dark:#0B0908;--cream:#F4F0EB;--muted:#B9AFA7;--muted2:#8A7F77;
  --line:#33291F;--ice:#9FD4FF}
html,body{height:100%}
body{background:var(--dark);color:var(--cream);overflow:hidden;
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}
.scene{position:fixed;inset:0;overflow:hidden;background:#0B0908}
.scene-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:50% 50%}
.core-fx{position:absolute;pointer-events:none;mix-blend-mode:screen}
.core-flash{position:absolute;pointer-events:none;opacity:0;border-radius:50%;
  background:radial-gradient(circle,rgba(230,246,255,.85) 0%,
    rgba(160,214,255,.35) 34%,rgba(120,190,255,0) 66%);
  filter:blur(6px);mix-blend-mode:screen;transition:none}
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(115% 80% at 50% 42%,transparent 42%,rgba(6,5,4,.66) 100%)}

.top{position:fixed;left:0;right:0;top:0;z-index:6;display:flex;
  align-items:center;justify-content:space-between;
  padding:22px clamp(18px,3.5vw,44px)}
.brand{font-size:13px;letter-spacing:.26em;text-transform:uppercase;font-weight:600}
.brand b{color:var(--ice);font-weight:600}

.menu{display:flex;gap:6px;align-items:center}
.mi{display:flex;align-items:center;gap:9px;padding:10px 15px;border-radius:12px;
  border:1px solid rgba(255,255,255,.08);background:rgba(9,8,7,.5);
  backdrop-filter:blur(10px);color:var(--muted);font:inherit;font-size:13px;
  cursor:pointer;transition:.22s;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap}
.mi u{text-decoration:none;font-size:10px;letter-spacing:.14em;opacity:.6}
.mi:hover,.mi:focus-visible{color:#fff;border-color:rgba(159,212,255,.5);
  background:rgba(16,26,36,.7);outline:none}

.hint{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:6;
  font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  text-align:center;line-height:1.9;padding:11px 20px;border-radius:14px;
  border:1px solid rgba(255,255,255,.08);background:rgba(9,8,7,.62);
  backdrop-filter:blur(10px);text-shadow:0 1px 3px rgba(0,0,0,.7)}
.hint b{color:var(--ice);font-weight:600}
.hint i{display:none;font-style:normal}

@media (max-width:820px){
  .scene-img{object-position:50% 46%}
  .top{flex-direction:column;align-items:stretch;gap:14px;padding:16px 14px}
  .brand{font-size:11.5px;text-align:center}
  .menu{overflow-x:auto;padding-bottom:4px;gap:7px;
    scrollbar-width:none;-ms-overflow-style:none}
  .menu::-webkit-scrollbar{display:none}
  .mi{flex:0 0 auto;font-size:12px;padding:9px 12px}
  .hint{bottom:18px;font-size:10.5px;padding:9px 14px;letter-spacing:.14em}
  .hint span{display:none}
  .hint i{display:inline}
}
@media (prefers-reduced-motion:reduce){.core-flash{display:none}}

<script>/* ЖИВОЕ ЯДРО СИНАПСА — процедурная анимация поверх кадра.
   Почему кодом, а не видео: ядро должно ОТВЕЧАТЬ на наведение мыши,
   а видео только проигрывается. Плюс вечный цикл без единого килобайта.

   Разметка:
     <div class="scene">
       <img class="scene-img" src="...">
       <canvas class="core-fx"></canvas>
       <div class="core-flash"></div>
     </div>
   Ядро на кадре стоит в точке CX/CY (доля кадра) — замерено по канону.

   Наружу: SynapseCore.flash()  — всплеск энергии
           SynapseCore.hold(on) — держать повышенную активность
*/
window.SynapseCore = (function () {
  var CX = 0.50, CY = 0.405;   // центр ядра в кадре
  var R  = 0.105;              // радиус плотной части, доля ШИРИНЫ кадра

  var cv, ctx, flashEl, sceneEl, imgEl;
  var W = 0, H = 0, dpr = 1;
  var fil = [], loops = [];
  var t = 0, pulse = 0, target = 0, held = 0;
  var running = false, visible = true, reduced = false;
  var MOB = false;

  function rnd(a, b) { return a + Math.random() * (b - a); }

  function build() {
    var N = MOB ? 30 : 54;
    fil = [];
    for (var i = 0; i < N; i++) {
      var a = (i / N) * Math.PI * 2 + rnd(-0.05, 0.05);
      fil.push({
        a: a,
        w: rnd(0.25, 0.75),          // скорость колебания
        p: rnd(0, Math.PI * 2),      // фаза
        l: rnd(0.15, 1.35),          // длина сверх радиуса
        b: rnd(0.25, 1.0),           // яркость
        s: rnd(0.55, 1.6),           // толщина
        c: rnd(-1, 1)                // сторона изгиба
      });
    }
    var M = MOB ? 8 : 14;
    loops = [];
    for (var j = 0; j < M; j++) {
      loops.push({
        r: rnd(0.28, 0.92),
        tilt: rnd(0, Math.PI),
        w: rnd(0.18, 0.5),
        p: rnd(0, Math.PI * 2),
        h1: rnd(0.06, 0.2), h2: rnd(0.04, 0.14),
        b: rnd(0.2, 0.7)
      });
    }
  }

  function size() {
    var r = sceneEl.getBoundingClientRect();
    if (!r.width) return;
    var side = Math.round(r.width * R * 6.4);      // поле с запасом под нити
    dpr = Math.min(window.devicePixelRatio || 1, MOB ? 1.5 : 2);
    W = side; H = side;
    cv.style.width = side + 'px';
    cv.style.height = side + 'px';
    cv.width = Math.round(side * dpr);
    cv.height = Math.round(side * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // позиция ядра внутри кадра — учитываем object-fit: cover
    place(r);
  }

  function place(r) {
    var nw = imgEl.naturalWidth || 16, nh = imgEl.naturalHeight || 9;
    var sc = Math.max(r.width / nw, r.height / nh);   // cover
    var dw = nw * sc, dh = nh * sc;
    var ox = (r.width - dw) / 2, oy = (r.height - dh) / 2;
    // если у картинки задан object-position — учитываем по горизонтали
    var op = getComputedStyle(imgEl).objectPosition.split(' ');
    if (op.length && op[0].indexOf('%') > 0) {
      ox = (r.width - dw) * (parseFloat(op[0]) / 100);
    }
    if (op.length > 1 && op[1].indexOf('%') > 0) {
      oy = (r.height - dh) * (parseFloat(op[1]) / 100);
    }
    var px = ox + dw * CX, py = oy + dh * CY;
    cv.style.left = (px - W / 2) + 'px';
    cv.style.top = (py - H / 2) + 'px';
    if (flashEl) {
      flashEl.style.left = (px - W / 2) + 'px';
      flashEl.style.top = (py - H / 2) + 'px';
      flashEl.style.width = W + 'px';
      flashEl.style.height = H + 'px';
    }
    cv._R = sceneEl.getBoundingClientRect().width * R;
  }

  function draw() {
    var cx = W / 2, cy = H / 2, Rr = cv._R || W / 6.4;
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    var p = pulse;
    // цвет: покой — голубой, всплеск — к белому
    var cr = Math.round(126 + 104 * p);
    var cg = Math.round(196 + 50 * p);
    var cb = 255;

    // внутренний клубок — «мыслительные процессы»
    for (var j = 0; j < loops.length; j++) {
      var L = loops[j];
      ctx.beginPath();
      for (var k = 0; k <= 48; k++) {
        var th = (k / 48) * Math.PI * 2;
        var rr = Rr * L.r * (1
          + L.h1 * Math.sin(th * 3 + t * L.w + L.p)
          + L.h2 * Math.sin(th * 5 - t * L.w * 1.7));
        var x = cx + Math.cos(th) * rr;
        var y = cy + Math.sin(th) * rr * 0.86;
        // лёгкий наклон
        var xr = cx + (x - cx) * Math.cos(L.tilt) - (y - cy) * Math.sin(L.tilt);
        var yr = cy + (x - cx) * Math.sin(L.tilt) + (y - cy) * Math.cos(L.tilt);
        if (k === 0) ctx.moveTo(xr, yr); else ctx.lineTo(xr, yr);
      }
      ctx.closePath();
      ctx.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (0.05 + 0.09 * L.b + 0.10 * p) + ')';
      ctx.lineWidth = 1 + 0.5 * p;
      ctx.stroke();
    }

    // нити наружу
    for (var i = 0; i < fil.length; i++) {
      var F = fil[i];
      var a = F.a + Math.sin(t * F.w + F.p) * 0.10;
      var r0 = Rr * 0.5;
      var r1 = Rr * (1.0 + F.l) * (1 + p * 0.42);
      var x0 = cx + Math.cos(a) * r0, y0 = cy + Math.sin(a) * r0;
      var x1 = cx + Math.cos(a) * r1, y1 = cy + Math.sin(a) * r1;
      var mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
      var off = (r1 - r0) * 0.34 * F.c * Math.sin(t * F.w * 0.8 + F.p);
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.quadraticCurveTo(mx - Math.sin(a) * off, my + Math.cos(a) * off, x1, y1);
      ctx.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (0.06 + 0.16 * F.b + 0.20 * p) + ')';
      ctx.lineWidth = (F.s * 0.9) * (1 + p * 0.5);
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // ядро-свечение
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Rr * 1.15);
    g.addColorStop(0, 'rgba(' + cr + ',' + cg + ',255,' + (0.16 + 0.30 * p) + ')');
    g.addColorStop(0.55, 'rgba(120,190,255,' + (0.06 + 0.14 * p) + ')');
    g.addColorStop(1, 'rgba(90,160,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, Rr * 1.15, 0, Math.PI * 2); ctx.fill();

    ctx.globalCompositeOperation = 'source-over';
    if (flashEl) flashEl.style.opacity = (p * 0.85).toFixed(3);
  }

  function loop() {
    if (!running) return;
    if (visible) {
      t += 0.016;
      target = held;
      pulse += (target - pulse) * (pulse < target ? 0.20 : 0.055);
      if (pulse < 0.0015 && target === 0) pulse = 0;
      draw();
    }
    requestAnimationFrame(loop);
  }

  function init(scene) {
    sceneEl = scene;
    imgEl = scene.querySelector('.scene-img');
    cv = scene.querySelector('.core-fx');
    flashEl = scene.querySelector('.core-flash');
    if (!cv || !imgEl) return;
    ctx = cv.getContext('2d');
    MOB = window.matchMedia('(max-width:820px)').matches;
    reduced = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    build();
    var ready = function () { size(); draw(); };
    if (imgEl.complete && imgEl.naturalWidth) ready();
    else imgEl.addEventListener('load', ready);
    addEventListener('resize', function () {
      MOB = window.matchMedia('(max-width:820px)').matches;
      build(); size();
    }, { passive: true });
    document.addEventListener('visibilitychange', function () {
      visible = !document.hidden;
    });
    if (reduced) { size(); pulse = 0.15; draw(); return; }
    running = true;
    requestAnimationFrame(loop);
  }

  return {
    init: init,
    hold: function (on) { held = on ? 1 : 0; },
    flash: function () {
      held = 1;
      setTimeout(function () { held = 0; }, 190);
    }
  };
})();
</script>
<script>
(function(){
  var scene=document.querySelector('.scene');
  SynapseCore.init(scene);
  var over=false;
  document.querySelectorAll('.mi').forEach(function(b){
    b.addEventListener('mouseenter',function(){over=true;SynapseCore.hold(true);});
    b.addEventListener('mouseleave',function(){over=false;SynapseCore.hold(false);});
    b.addEventListener('focus',function(){SynapseCore.hold(true);});
    b.addEventListener('blur',function(){if(!over)SynapseCore.hold(false);});
    // на телефоне наведения нет — всплеск по касанию
    b.addEventListener('touchstart',function(){SynapseCore.flash();},{passive:true});
  });
})();
</script></body></html>
